<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FF8700">
<title>F1 Dash</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a3d0a; touch-action: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overscroll-behavior: none; }
  canvas { display: block; }
  canvas#game { width: 100vw; height: 100vh; }

  #ui {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: 14px;
    right: 14px;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .top-row { display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
  .stat {
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 8px 10px;
    border-radius: 10px;
    font-size: 10px;
    letter-spacing: 2px;
    color: white;
    font-weight: 700;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .stat span.val {
    color: #FF8700;
    font-size: 16px;
    margin-left: 6px;
    font-variant-numeric: tabular-nums;
    font-weight: 800;
  }
  .stat.pass span.val { color: #00ff66; }
  .stat.pass small { color: #888; font-size: 10px; margin-left: 2px; }
  .stat.time span.val { color: #00d2ff; }
  .stat.time small { color: #888; font-size: 10px; }
  .stat.pos span.val { color: #ffd000; }

  /* Tire bar */
  #tireBar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 12px;
    pointer-events: none;
  }
  .tire-letter {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 900;
    flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.3);
  }
  .tire-letter.soft   { background: #ff3030; color: white; }
  .tire-letter.medium { background: #ffd000; color: black; }
  .tire-letter.hard   { background: #e8e8e8; color: black; }
  .tire-bar-bg {
    flex: 1;
    height: 8px;
    background: rgba(255,255,255,0.15);
    border-radius: 4px;
    overflow: hidden;
  }
  .tire-bar-fill {
    height: 100%;
    width: 100%;
    background: #ffd000;
    transition: width 0.15s linear, background 0.3s;
    border-radius: 4px;
  }
  .tire-bar-fill.warn { animation: warnPulse 0.6s infinite alternate; }
  @keyframes warnPulse { from { opacity: 1; } to { opacity: 0.4; } }
  #tirePct {
    font-size: 11px;
    color: #fff;
    font-variant-numeric: tabular-nums;
    min-width: 36px;
    text-align: right;
    letter-spacing: 1px;
  }

  /* Sector banner */
  #sectorBanner {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.6);
    z-index: 3;
    background: linear-gradient(90deg, rgba(0,0,0,0.85), rgba(20,20,20,0.85), rgba(0,0,0,0.85));
    border-top: 2px solid #00d2ff;
    border-bottom: 2px solid #00d2ff;
    padding: 14px 36px;
    color: white;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 6px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.35s;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  #sectorBanner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #sectorBanner .stime { display:block; color:#00d2ff; font-size:13px; letter-spacing:3px; margin-top:4px; font-weight:700; }

  /* Start lights */
  #startLights {
    position: fixed;
    top: 25%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: none;
    gap: 12px;
    z-index: 5;
    background: rgba(0,0,0,0.7);
    padding: 16px 22px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  #startLights.show { display: flex; }
  .light {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #2a0000;
    border: 2px solid #1a0000;
    box-shadow: inset 0 0 6px rgba(0,0,0,0.8);
    transition: background 0.05s, box-shadow 0.05s;
  }
  .light.on {
    background: #ff1a1a;
    box-shadow: 0 0 18px #ff1a1a, inset 0 0 6px rgba(255,255,255,0.4);
  }
  #goText {
    position: fixed;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.5);
    font-size: 64px;
    font-weight: 900;
    letter-spacing: 10px;
    color: #00ff66;
    text-shadow: 0 0 20px #00ff66, 0 0 40px rgba(0,255,102,0.6);
    opacity: 0;
    pointer-events: none;
    z-index: 5;
    transition: opacity 0.2s, transform 0.4s;
  }
  #goText.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* Overlays */
  #overlay, #pitstop {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.82);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 20px;
    overflow-y: auto;
  }
  #overlay { z-index: 3; }
  #pitstop { z-index: 4; }
  #overlay.hidden, #pitstop.hidden { display: none; }

  .panel {
    background: linear-gradient(180deg, #1a1a1a, #0d0d0d);
    border: 1px solid #FF8700;
    padding: 24px 22px;
    border-radius: 16px;
    text-align: center;
    color: white;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(255,135,0,0.3);
    transition: border-color 0.3s, box-shadow 0.3s;
    margin: auto;
  }
  .panel.win {
    border-color: #00ff66;
    box-shadow: 0 20px 60px rgba(0, 255, 102, 0.35);
  }
  .panel h1 { color: #FF8700; font-size: 28px; letter-spacing: 6px; margin-bottom: 4px; font-weight: 900; transition: color 0.3s; }
  .panel.win h1 { color: #00ff66; }
  .panel h2 { color: white; font-size: 15px; margin-bottom: 10px; font-weight: 600; }
  .panel p { color: #aaa; font-size: 12.5px; line-height: 1.5; margin-bottom: 12px; }

  /* Tier badge */
  .tier-badge {
    display: none;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 11px;
    letter-spacing: 3px;
    font-weight: 800;
    margin-bottom: 14px;
    border: 1px solid;
  }
  .tier-badge.show { display: inline-block; }
  .tier-badge.pole   { color: #ffd700; background: rgba(255,215,0,0.12); border-color: rgba(255,215,0,0.5); }
  .tier-badge.podium { color: #c0c0c0; background: rgba(192,192,192,0.12); border-color: rgba(192,192,192,0.5); }
  .tier-badge.points { color: #cd7f32; background: rgba(205,127,50,0.12); border-color: rgba(205,127,50,0.5); }
  .tier-badge.finish { color: #888;    background: rgba(136,136,136,0.12); border-color: rgba(136,136,136,0.4); }
  .tier-badge.newbest { color: #00ff66; background: rgba(0,255,102,0.12); border-color: rgba(0,255,102,0.6); }

  .scores { display: flex; justify-content: space-around; margin-bottom: 14px; padding: 12px 0; border-top: 1px solid #2a2a2a; border-bottom: 1px solid #2a2a2a; gap: 6px; }
  .scores.hidden { display: none; }
  .score-block { color: #777; font-size: 9px; letter-spacing: 2px; flex: 1; }
  .score-block strong { display: block; color: white; font-size: 18px; margin-top: 4px; font-variant-numeric: tabular-nums; font-weight: 800; }

  /* Pickers */
  .picker { margin: 6px 0 14px 0; }
  .picker-label { color: #777; font-size: 10px; letter-spacing: 3px; margin-bottom: 10px; }

  .livery-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px 4px;
    max-width: 360px;
    margin: 0 auto;
  }
  .livery-option {
    background: rgba(255,255,255,0.03);
    border: 2px solid transparent;
    border-radius: 10px;
    padding: 6px 2px 4px 2px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
    touch-action: manipulation;
  }
  .livery-option:active { transform: scale(0.94); }
  .livery-option.selected {
    border-color: rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.08);
    box-shadow: 0 0 10px rgba(255,255,255,0.15);
  }
  .livery-car { display: block; pointer-events: none; }
  .livery-name {
    font-size: 8px;
    letter-spacing: 1px;
    color: #888;
    text-transform: uppercase;
    font-weight: 700;
    text-align: center;
    line-height: 1.1;
    margin-top: 2px;
  }
  .livery-option.selected .livery-name { color: #fff; }

  /* Track + weather row */
  .opt-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .opt-group .opt-label { color:#666; font-size:9px; letter-spacing:2px; margin-bottom:6px; }
  .opt-btns { display:flex; gap:4px; }
  .opt-btn {
    flex:1; background: rgba(255,255,255,0.04);
    border: 1.5px solid rgba(255,255,255,0.1);
    color:#bbb; padding:8px 4px; border-radius:8px;
    font-size:10px; letter-spacing:1.5px; font-weight:800;
    cursor:pointer; touch-action:manipulation;
    transition: transform 0.1s, background 0.15s, border-color 0.15s, color 0.15s;
  }
  .opt-btn:active { transform: scale(0.94); }
  .opt-btn.sel { background: rgba(255,255,255,0.1); color:#fff; border-color: rgba(255,255,255,0.55); }

  button.cta { background: #FF8700; color: white; border: none; padding: 14px 36px; font-size: 14px; font-weight: 800; letter-spacing: 3px; border-radius: 10px; cursor: pointer; touch-action: manipulation; transition: transform 0.1s, background 0.2s; }
  button.cta:active { transform: scale(0.96); }
  .panel.win button.cta { background: #00ff66; color: #0a3d0a; }

  /* Pit stop panel */
  .pit-panel {
    background: linear-gradient(180deg, #1a1a1a, #0d0d0d);
    border: 1px solid #ffd000;
    padding: 24px 22px;
    border-radius: 16px;
    text-align: center;
    color: white;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(255,208,0,0.25);
  }
  .pit-panel h1 { color: #ffd000; font-size: 24px; letter-spacing: 6px; margin-bottom: 4px; font-weight: 900; }
  .pit-panel h2 { color: #aaa; font-size: 11px; letter-spacing: 3px; margin-bottom: 18px; font-weight: 600; }
  .tire-options { display: flex; flex-direction: column; gap: 10px; }
  .tire-option {
    background: rgba(255,255,255,0.04);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    text-align: left;
    color: white;
    transition: transform 0.1s, background 0.15s;
    touch-action: manipulation;
  }
  .tire-option:active { transform: scale(0.97); background: rgba(255,255,255,0.1); }
  .tire-option.soft   { border-color: rgba(255,48,48,0.6); }
  .tire-option.medium { border-color: rgba(255,208,0,0.6); }
  .tire-option.hard   { border-color: rgba(232,232,232,0.6); }
  .tire-circle { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; border: 3px solid #0d0d0d; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.15); }
  .tire-info { flex: 1; }
  .tire-info strong { display: block; font-size: 14px; letter-spacing: 2px; margin-bottom: 2px; }
  .tire-info span { font-size: 10px; color: #999; letter-spacing: 1px; }

  /* DRS button */
  #drsBtn {
    position: fixed;
    bottom: max(28px, env(safe-area-inset-bottom));
    right: 22px;
    width: 88px;
    height: 88px;
    border-radius: 50%;
    border: 3px solid #00ff66;
    background: rgba(0, 50, 20, 0.85);
    color: #00ff66;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 2px;
    box-shadow: 0 0 18px rgba(0, 255, 102, 0.5), inset 0 0 8px rgba(0,255,102,0.2);
    z-index: 2;
    touch-action: manipulation;
    cursor: pointer;
    transition: transform 0.1s;
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  #drsBtn.visible { display: flex; }
  #drsBtn:active { transform: scale(0.92); }
  #drsBtn.active {
    background: rgba(255, 220, 0, 0.95);
    border-color: #fff;
    color: #1a1a1a;
    box-shadow: 0 0 30px rgba(255, 220, 0, 0.9), inset 0 0 12px rgba(255,255,255,0.4);
    animation: drsPulse 0.4s infinite alternate;
  }
  #drsBtn.cooldown {
    background: rgba(40,40,40,0.7);
    border-color: #555;
    color: #777;
    box-shadow: none;
  }
  @keyframes drsPulse { from { transform: scale(1); } to { transform: scale(1.05); } }
  #drsBtn .timer {
    position: absolute;
    bottom: -22px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.7);
    font-weight: 700;
  }

  /* Slipstream indicator */
  #slipIndicator {
    position: fixed;
    bottom: max(28px, env(safe-area-inset-bottom));
    left: 22px;
    background: rgba(0,210,255,0.18);
    border: 1.5px solid #00d2ff;
    color: #00d2ff;
    font-size: 10px;
    letter-spacing: 2px;
    font-weight: 800;
    padding: 8px 12px;
    border-radius: 18px;
    opacity: 0;
    transition: opacity 0.15s;
    pointer-events: none;
    z-index: 2;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  #slipIndicator.show { opacity: 1; }

  .hint { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.5); font-size: 10px; letter-spacing: 2px; pointer-events: none; z-index: 2; text-align:center; width:100%; }

  /* Sound toggle */
  #soundBtn {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    right: 14px;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    border: 1px solid rgba(255,255,255,0.2);
    color: white;
    font-size: 16px;
    cursor: pointer;
    z-index: 6;
    display: none;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  #soundBtn.visible { display: flex; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">
  <div class="top-row">
    <div class="stat pos">POS<span class="val" id="position">P20</span></div>
    <div class="stat">SPD<span class="val" id="speed">0</span></div>
    <div class="stat pass">LAP<span class="val" id="passed">0</span><small>/60</small></div>
    <div class="stat time">TIME<span class="val" id="time">0.0</span><small>s</small></div>
  </div>
  <div id="tireBar" class="stat">
    <div class="tire-letter medium" id="tireLetter">M</div>
    <div class="tire-bar-bg"><div class="tire-bar-fill" id="tireFill"></div></div>
    <span id="tirePct">100%</span>
  </div>
</div>
<div class="hint">DRAG TO STEER · TAP DRS</div>

<button id="soundBtn" aria-label="Toggle sound">🔊</button>

<div id="startLights">
  <div class="light" id="l1"></div>
  <div class="light" id="l2"></div>
  <div class="light" id="l3"></div>
  <div class="light" id="l4"></div>
  <div class="light" id="l5"></div>
</div>
<div id="goText">GO!</div>

<div id="sectorBanner"><span id="sectorMain">SECTOR 1</span><span class="stime" id="sectorTime"></span></div>

<button id="drsBtn" aria-label="DRS Boost">DRS<span class="timer" id="drsTimer"></span></button>
<div id="slipIndicator">SLIPSTREAM</div>

<div id="overlay">
  <div class="panel" id="endPanel">
    <h1 id="title">F1 DASH</h1>
    <h2 id="subtitle">Lights out, go go go.</h2>
    <div class="tier-badge" id="tierBadge"></div>
    <p id="instructions">Drag to steer · tap <strong style="color:#00ff66">DRS</strong> for boost · slipstream behind rivals · <strong style="color:#00ff66">pass 60 cars</strong> to win.</p>

    <div class="opt-row">
      <div class="opt-group">
        <div class="opt-label">TRACK</div>
        <div class="opt-btns" id="trackBtns">
          <button class="opt-btn sel" data-track="silverstone">SILV</button>
          <button class="opt-btn" data-track="monaco">MNCO</button>
          <button class="opt-btn" data-track="monza">MNZA</button>
        </div>
      </div>
      <div class="opt-group">
        <div class="opt-label">WEATHER</div>
        <div class="opt-btns" id="weatherBtns">
          <button class="opt-btn sel" data-weather="dry">DRY</button>
          <button class="opt-btn" data-weather="rain">RAIN</button>
        </div>
      </div>
    </div>

    <div class="picker" id="liveryPicker">
      <div class="picker-label">CHOOSE YOUR TEAM</div>
      <div class="livery-grid" id="liveryGrid"></div>
    </div>

    <div class="scores hidden" id="scoreDisplay">
      <div class="score-block">TIME<strong id="finalTime">0.0s</strong></div>
      <div class="score-block">PASSED<strong id="finalPassed">0</strong></div>
      <div class="score-block">BEST<strong id="bestTime">—</strong></div>
    </div>
    <button id="startBtn" class="cta">START</button>
  </div>
</div>

<div id="pitstop" class="hidden">
  <div class="pit-panel">
    <h1>PIT STOP</h1>
    <h2>TIRES BLOWN — CHOOSE COMPOUND</h2>
    <div class="tire-options">
      <button class="tire-option soft" data-tire="soft">
        <div class="tire-circle" style="background:#ff3030"></div>
        <div class="tire-info">
          <strong>SOFT</strong>
          <span>Quickest pace · wears fast</span>
        </div>
      </button>
      <button class="tire-option medium" data-tire="medium">
        <div class="tire-circle" style="background:#ffd000"></div>
        <div class="tire-info">
          <strong>MEDIUM</strong>
          <span>Balanced pace and life</span>
        </div>
      </button>
      <button class="tire-option hard" data-tire="hard">
        <div class="tire-circle" style="background:#e8e8e8"></div>
        <div class="tire-info">
          <strong>HARD</strong>
          <span>Slower · lasts much longer</span>
        </div>
      </button>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const drsBtn = document.getElementById('drsBtn');
  const drsTimerEl = document.getElementById('drsTimer');
  const tireFillEl = document.getElementById('tireFill');
  const tirePctEl = document.getElementById('tirePct');
  const tireLetterEl = document.getElementById('tireLetter');
  const passedEl = document.getElementById('passed');
  const timeEl = document.getElementById('time');
  const positionEl = document.getElementById('position');
  const slipIndicator = document.getElementById('slipIndicator');
  const sectorBanner = document.getElementById('sectorBanner');
  const sectorMain = document.getElementById('sectorMain');
  const sectorTimeEl = document.getElementById('sectorTime');
  const startLightsEl = document.getElementById('startLights');
  const goTextEl = document.getElementById('goText');
  const soundBtn = document.getElementById('soundBtn');
  let W, H, dpr;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    setupRoad();
  }

  let best = 0;
  try { best = parseInt(localStorage.getItem('f1dash_best') || '0', 10); } catch(e) {}
  let bestWinFrames = 0;
  try { bestWinFrames = parseInt(localStorage.getItem('f1dash_bestTime') || '0', 10); } catch(e) {}

  // ---- F1 teams ----
  const F1_TEAMS = [
    { name: 'McLaren',  color: '#FF8700' },
    { name: 'Ferrari',  color: '#DC0000' },
    { name: 'Mercedes', color: '#27F4D2' },
    { name: 'Red Bull', color: '#3671C6' },
    { name: 'Aston',    color: '#229971' },
    { name: 'Alpine',   color: '#FF87BC' },
    { name: 'Williams', color: '#64C4FF' },
    { name: 'Haas',     color: '#B6BABD' },
    { name: 'Sauber',   color: '#52E252' },
    { name: 'RB',       color: '#6692FF' }
  ];

  let playerColor = '#FF8700';
  try {
    const saved = localStorage.getItem('f1dash_color');
    if (saved && F1_TEAMS.some(t => t.color === saved)) playerColor = saved;
  } catch(e) {}

  // ---- Tracks ----
  const TRACKS = {
    silverstone: {
      name: 'SILVERSTONE',
      grass1: '#0a3d0a', grass2: '#0d4d0d',
      asphalt: '#1f1f1f',
      curb1: '#e02020', curb2: '#f5f5f5',

  function buildCrowd() {
    // Crowd dots in the grass area, pre-baked positions

    const grassRightW = W - grassRightX;
    const palette = ['#ff4040', '#ffd000', '#1e90ff', '#ffffff', '#ff8c00', '#00d2ff', '#ff3ea0', '#52E252'];
    const totalY = H * 3;
    const density = 0.0008;
    const count = Math.floor(totalY * (grassLeftW + grassRightW) * density);
    for (let i = 0; i < count; i++) {
      const side = Math.random() < 0.5 ? 'L' : 'R';
      const x = side === 'L'
        ? 4 + Math.random() * Math.max(8, grassLeftW - 8)
        : grassRightX + 4 + Math.random() * Math.max(8, grassRightW - 8);
      state.crowd.push({
        x, y: Math.random() * totalY,
        color: palette[Math.floor(Math.random() * palette.length)],
        size: 1.6 + Math.random() * 1.2,
        bob: Math.random() * Math.PI * 2

  let audioCtx = null;

  let engineOsc = null, engineGain = null, engineFilter = null;

  function ensureAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch(e) { return null; }
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function startEngine() {
    if (!soundEnabled) return;
    const ac = ensureAudio();
    if (!ac) return;
    if (engineOsc) return;
    engineOsc = ac.createOscillator();
    engineOsc.type = 'sawtooth';
    engineOsc.frequency.value = 60;
    engineFilter = ac.createBiquadFilter();
    engineFilter.type = 'lowpass';
    engineFilter.frequency.value = 700;
    engineGain = ac.createGain();
    engineGain.gain.value = 0;
    engineOsc.connect(engineFilter);
    engineFilter.connect(engineGain);
    engineGain.connect(ac.destination);
    engineOsc.start();
    engineGain.gain.linearRampToValueAtTime(0.04, ac.currentTime + 0.4);
  }
  function stopEngine() {
    if (!engineOsc) return;
    try {
      engineGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
      const o = engineOsc; setTimeout(() => { try { o.stop(); } catch(e){} }, 250);
    } catch(e) {}
    engineOsc = null;
  }
  function updateEngine(speedNorm, drsActive) {
    if (!engineOsc || !audioCtx) return;
    const baseFreq = 55 + speedNorm * 130 + (drsActive ? 25 : 0);
    engineOsc.frequency.setTargetAtTime(baseFreq, audioCtx.currentTime, 0.05);
    engineFilter.frequency.setTargetAtTime(500 + speedNorm * 1400, audioCtx.currentTime, 0.05);
    engineGain.gain.setTargetAtTime(0.035 + speedNorm * 0.025, audioCtx.currentTime, 0.05);
  }

  function playBeep(freq, dur, type, vol) {
    if (!soundEnabled) return;
    const ac = ensureAudio(); if (!ac) return;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.value = 0;
    o.connect(g); g.connect(ac.destination);
    o.start();
    g.gain.linearRampToValueAtTime(vol || 0.12, ac.currentTime + 0.01);
    g.gain.linearRampToValueAtTime(0, ac.currentTime + dur);
    o.stop(ac.currentTime + dur + 0.02);
  }
  function playSweep(f1, f2, dur, vol) {
    if (!soundEnabled) return;
    const ac = ensureAudio(); if (!ac) return;
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(f1, ac.currentTime);
    o.frequency.linearRampToValueAtTime(f2, ac.currentTime + dur);
    g.gain.value = 0;
    o.connect(g); g.connect(ac.destination);
    o.start();
    g.gain.linearRampToValueAtTime(vol || 0.1, ac.currentTime + 0.02);
    g.gain.linearRampToValueAtTime(0, ac.currentTime + dur);
    o.stop(ac.currentTime + dur + 0.02);
  }
  function playNoise(dur, vol, filterFreq) {
    if (!soundEnabled) return;
    const ac = ensureAudio(); if (!ac) return;
    const bufferSize = Math.floor(ac.sampleRate * dur);
    const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = ac.createBufferSource();
    noise.buffer = buffer;
    const filt = ac.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.value = filterFreq || 800;
    const g = ac.createGain();
    g.gain.value = vol || 0.2;
    noise.connect(filt); filt.connect(g); g.connect(ac.destination);
    noise.start();
    g.gain.linearRampToValueAtTime(0, ac.currentTime + dur);
    noise.stop(ac.currentTime + dur + 0.02);
  }

  // ---- Mini car drawer for livery picker ----
  function drawMiniCar(c, color, w, h) {
    c.clearRect(0, 0, w, h);
    c.save();
    c.translate(w / 2, h / 2);
    const carW = w * 0.72;
    const carH = h * 0.86;

    c.fillStyle = 'rgba(0,0,0,0.4)';
    c.beginPath();
    c.ellipse(0, carH * 0.48, carW * 0.5, carH * 0.08, 0, 0, Math.PI * 2);
    c.fill();

    c.fillStyle = '#0a0a0a';
    c.fillRect(-carW * 0.55, -carH * 0.30, carW * 0.10, carH * 0.18);
    c.fillRect(carW * 0.55 - carW * 0.10, -carH * 0.30, carW * 0.10, carH * 0.18);
    c.fillRect(-carW * 0.60, carH * 0.18, carW * 0.14, carH * 0.22);
    c.fillRect(carW * 0.60 - carW * 0.14, carH * 0.18, carW * 0.14, carH * 0.22);

    c.fillStyle = color;
    c.beginPath();
    c.moveTo(-carW * 0.16, -carH / 2);
    c.lineTo(carW * 0.16, -carH / 2);
    c.lineTo(carW * 0.30, -carH * 0.18);
    c.lineTo(carW * 0.30, carH * 0.05);
    c.lineTo(carW * 0.48, carH * 0.32);
    c.lineTo(carW * 0.42, carH * 0.48);
    c.lineTo(-carW * 0.42, carH * 0.48);
    c.lineTo(-carW * 0.48, carH * 0.32);
    c.lineTo(-carW * 0.30, carH * 0.05);
    c.lineTo(-carW * 0.30, -carH * 0.18);
    c.closePath();
    c.fill();

    c.fillStyle = 'rgba(255,255,255,0.85)';
    c.fillRect(-carW * 0.04, -carH * 0.45, carW * 0.08, carH * 0.85);

    c.fillStyle = '#080808';
    c.beginPath();
    c.ellipse(0, -carH * 0.02, carW * 0.16, carH * 0.16, 0, 0, Math.PI * 2);
    c.fill();

    c.strokeStyle = '#1a1a1a';
    c.lineWidth = 1.5;
    c.beginPath();
    c.arc(0, -carH * 0.02, carW * 0.22, 0, Math.PI * 2);
    c.stroke();

    c.fillStyle = color;
    c.fillRect(-carW * 0.5, -carH / 2 - 4, carW, 5);
    c.fillStyle = '#0a0a0a';
    c.fillRect(-carW * 0.5, -carH / 2 - 4, carW, 1.2);
    c.fillStyle = '#1a1a1a';
    c.fillRect(-carW * 0.5, carH * 0.49, carW, 3.5);
    c.fillStyle = color;
    c.fillRect(-carW * 0.46, carH * 0.49 + 3.5, carW * 0.92, 2.5);

    c.restore();
  }

      const cv = document.createElement('canvas');
      const cwPx = 50, chPx = 70;
      const ratio = window.devicePixelRatio || 1;
      cv.width = cwPx * ratio;
      cv.height = chPx * ratio;
      cv.style.width = cwPx + 'px';
      cv.style.height = chPx + 'px';
      cv.className = 'livery-car';
      const c = cv.getContext('2d');
      c.setTransform(ratio, 0, 0, ratio, 0, 0);
      drawMiniCar(c, team.color, cwPx, chPx);

      const name = document.createElement('div');
      name.className = 'livery-name';
      name.textContent = team.name;

      opt.appendChild(cv);

    const x = state.roadX + state.laneWidth * (lane + 0.5);

    state.obstacles.push({
      x, y: -110, w: state.car.w, h: state.car.h,
      color: pool[Math.floor(Math.random() * pool.length)],
      speed: 0.85 + Math.random() * 0.3

    state.sectorTimes = [];
    state.slipstreaming = false;
    drsBtn.classList.remove('active', 'cooldown');
    document.getElementById('endPanel').classList.remove('win');
    const badge = document.getElementById('tierBadge');
    badge.classList.remove('show', 'pole', 'podium', 'points', 'finish', 'newbest');
    buildBillboards();
    updateTireUI();
    updatePassedUI();
    updateTimeUI();
    updatePositionUI();
  }

  function runStartLights() {
    state.countdown = true;
    const lights = [document.getElementById('l1'), document.getElementById('l2'), document.getElementById('l3'), document.getElementById('l4'), document.getElementById('l5')];
    lights.forEach(l => l.classList.remove('on'));
    startLightsEl.classList.add('show');
    goTextEl.classList.remove('show');

    let i = 0;
    const interval = setInterval(() => {
      lights[i].classList.add('on');
      soundLightOn();
      i++;
      if (i >= 5) {
        clearInterval(interval);
        const hold = 700 + Math.random() * 1400;
        setTimeout(() => {
          lights.forEach(l => l.classList.remove('on'));
          soundLightOff();
          startLightsEl.classList.remove('show');
          goTextEl.classList.add('show');
          state.countdown = false;
          state.running = true;
          state.speed = 1.5;
          state.sectorStartFrames = 0;
          startEngine();
          drsBtn.classList.add('visible');
          soundBtn.classList.add('visible');
          setTimeout(() => goTextEl.classList.remove('show'), 600);
        }, hold);
      }
    }, 800);
  }

  function start() {
    reset();
    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('scoreDisplay').classList.remove('hidden');
    document.getElementById('liveryPicker').style.display = 'none';
    document.querySelector('.opt-row').style.display = 'none';
    ensureAudio(); // Unlock audio on first user gesture
    runStartLights();
  }

  function endRace({ won }) {
    state.running = false;
    state.countdown = false;
    drsBtn.classList.remove('visible');
    stopEngine();
    const score = Math.floor(state.distance);
    const isNewBestDist = score > best;
    if (isNewBestDist) {
      best = score;
      try { localStorage.setItem('f1dash_best', best); } catch(e) {}
    }
    const finishFrames = state.raceFrames;
    const isNewBestTime = won && (bestWinFrames === 0 || finishFrames < bestWinFrames);
    if (isNewBestTime) {
      bestWinFrames = finishFrames;
      try { localStorage.setItem('f1dash_bestTime', bestWinFrames); } catch(e) {}
    }

    document.getElementById('finalTime').textContent = formatTimeSeconds(finishFrames);
    document.getElementById('finalPassed').textContent = state.passed;
    document.getElementById('bestTime').textContent = bestWinFrames > 0 ? formatTimeSeconds(bestWinFrames) : '—';

    const endPanel = document.getElementById('endPanel');
    const badge = document.getElementById('tierBadge');
    badge.classList.remove('show', 'pole', 'podium', 'points', 'finish', 'newbest');

    if (won) {
      endPanel.classList.add('win');
      const tier = getTier(finishFrames);
      document.getElementById('title').textContent = 'P1 — CHECKERED FLAG';
      document.getElementById('subtitle').textContent = isNewBestTime ? 'New personal best!' : 'You took the win.';
      badge.classList.add('show', isNewBestTime ? 'newbest' : tier.cls);
      badge.textContent = isNewBestTime ? '★ NEW BEST · ' + tier.name : tier.name;
      const sectorTxt = state.sectorTimes.length
        ? '<br><span style="color:#888;font-size:11px;">S1 ' + (state.sectorTimes[0]/60).toFixed(2)
          + ' · S2 ' + ((state.sectorTimes[1]||0)/60).toFixed(2)
          + ' · S3 ' + ((state.sectorTimes[2]||0)/60).toFixed(2) + '</span>'
        : '';
      const delta = bestWinFrames > 0 && !isNewBestTime
        ? '<br><span style="color:#888;font-size:11px;">+ ' + ((finishFrames - bestWinFrames) / 60).toFixed(2) + 's off your best</span>'
        : '';
      document.getElementById('instructions').innerHTML =
        'Overtook <strong style="color:#00ff66">' + WIN_TARGET + '</strong> cars in <strong style="color:#00d2ff">' + formatTimeSeconds(finishFrames) + '</strong>.' + delta + sectorTxt;
    } else {
      endPanel.classList.remove('win');
      document.getElementById('title').textContent = 'WRECKED.';
      document.getElementById('subtitle').textContent = isNewBestDist ? 'New best distance.' : 'You crashed out.';
      document.getElementById('instructions').innerHTML =
        'Passed <strong style="color:#00ff66">' + state.passed + '</strong> of ' + WIN_TARGET + ' before the wreck.';
    }
    document.getElementById('startBtn').textContent = 'RACE AGAIN';
    document.getElementById('overlay').classList.remove('hidden');
    // Re-show track/weather pickers but not livery (player already chose)
    document.querySelector('.opt-row').style.display = 'grid';
  }

  function winRace() {
    if (state.crashed || state.won) return;
    state.won = true;
    state.drsActive = false;
    drsBtn.classList.remove('active', 'cooldown');
    soundWin();
    const tier = getTier(state.raceFrames);
    const intensity = tier.cls === 'pole' ? 2 : (tier.cls === 'podium' ? 1.4 : 1);
    spawnConfetti(intensity);
    setTimeout(() => spawnConfetti(intensity), 500);
    setTimeout(() => endRace({ won: true }), 1500);
  }

  function gameOver() {
    if (state.crashed || state.won) return;
    state.crashed = true;
    state.shake = 22;
    drsBtn.classList.remove('active', 'cooldown');
    state.drsActive = false;
    soundCrash();

    for (let i = 0; i < 50; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 2 + Math.random() * 7;
      const palette = ['#ff4500', '#ffdd00', '#ff8800', '#ff2200'];
      spawnParticle(state.car.x, state.car.y, Math.cos(a) * sp, Math.sin(a) * sp - 2,
        palette[Math.floor(Math.random() * palette.length)], 50 + Math.random() * 40, 2 + Math.random() * 4);
    }
    for (let i = 0; i < 20; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 3;
      spawnParticle(state.car.x, state.car.y, Math.cos(a) * sp, Math.sin(a) * sp - 1, 'rgba(80,80,80,0.7)', 70, 5);
    }
    setTimeout(() => endRace({ won: false }), 1300);
  }

  // ---- Drawing ----
  function drawCar(x, y, w, h, color, isPlayer) {
    ctx.save();
    ctx.translate(x, y);

    // Shadow (bigger if rain — reflection-ish)
    ctx.fillStyle = weather === 'rain' ? 'rgba(0,0,0,0.5)' : 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(0, h * 0.48, w * 0.55, h * 0.12, 0, 0, Math.PI * 2);
    ctx.fill();

    // Brake lights for rival cars (on rear wing) - always present, glow when close
    if (!isPlayer) {
      const dist = Math.hypot(x - state.car.x, y - state.car.y);
      const close = dist < 240;
      ctx.fillStyle = close ? '#ff1010' : '#aa0000';
      if (close) {
        ctx.shadowColor = '#ff2020';
        ctx.shadowBlur = 12;
      }
      ctx.fillRect(-w * 0.34, h * 0.42, w * 0.16, 4);
      ctx.fillRect(w * 0.18, h * 0.42, w * 0.16, 4);
      ctx.shadowBlur = 0;
    }

    const wheelColor = isPlayer ? TIRES[state.currentTire].color : '#0a0a0a';
    const wheelStroke = isPlayer ? '#0a0a0a' : null;
    ctx.fillStyle = wheelColor;
    ctx.fillRect(-w * 0.55, -h * 0.30, 7, h * 0.20);
    ctx.fillRect(w * 0.55 - 7, -h * 0.30, 7, h * 0.20);
    ctx.fillRect(-w * 0.6, h * 0.18, 9, h * 0.24);
    ctx.fillRect(w * 0.6 - 9, h * 0.18, 9, h * 0.24);
    if (wheelStroke) {
      ctx.strokeStyle = wheelStroke; ctx.lineWidth = 1;
      ctx.strokeRect(-w * 0.55, -h * 0.30, 7, h * 0.20);
      ctx.strokeRect(w * 0.55 - 7, -h * 0.30, 7, h * 0.20);
      ctx.strokeRect(-w * 0.6, h * 0.18, 9, h * 0.24);
      ctx.strokeRect(w * 0.6 - 9, h * 0.18, 9, h * 0.24);
    }

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-w * 0.16, -h / 2);
    ctx.lineTo(w * 0.16, -h / 2);
    ctx.lineTo(w * 0.30, -h * 0.18);
    ctx.lineTo(w * 0.30, h * 0.05);
    ctx.lineTo(w * 0.48, h * 0.32);
    ctx.lineTo(w * 0.42, h * 0.48);
    ctx.lineTo(-w * 0.42, h * 0.48);
    ctx.lineTo(-w * 0.48, h * 0.32);
    ctx.lineTo(-w * 0.30, h * 0.05);
    ctx.lineTo(-w * 0.30, -h * 0.18);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = isPlayer ? '#ffffff' : 'rgba(0,0,0,0.25)';
    ctx.fillRect(-w * 0.04, -h * 0.45, w * 0.08, h * 0.85);

    ctx.fillStyle = '#080808';
    ctx.beginPath();
    ctx.ellipse(0, -h * 0.02, w * 0.16, h * 0.16, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, -h * 0.02, w * 0.22, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = color;
    ctx.fillRect(-w * 0.5, -h / 2 - 5, w, 6);
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(-w * 0.5, -h / 2 - 5, w, 1.5);

    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-w * 0.5, h * 0.49, w, 4);
    ctx.fillStyle = color;
    ctx.fillRect(-w * 0.46, h * 0.49 + 4, w * 0.92, 3);

    if (isPlayer) {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, h * 0.28, w * 0.13, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = color;
      ctx.font = 'bold ' + Math.round(w * 0.20) + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('1', 0, h * 0.29);

      if (state.drsActive) {
        ctx.fillStyle = '#ffdd00';
        ctx.fillRect(-w * 0.42, h * 0.44, w * 0.84, 3);
        ctx.fillStyle = 'rgba(255, 220, 0, 0.3)';
        ctx.fillRect(-w * 0.5, h * 0.5, w, 8);
      }
      if (state.slipstreaming) {
        ctx.strokeStyle = 'rgba(0, 210, 255, 0.6)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, w * 0.85, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  function drawCrowdAndBillboards() {
    const off = state.roadOffset;
    const totalY = H * 3;
    // Crowd dots
    for (const p of state.crowd) {
      let y = (p.y + off * 0.9) % totalY;
      if (y < -10) y += totalY;
      if (y > H + 10) continue;
      const bob = Math.sin((off + p.bob * 100) * 0.02) * 1.2;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, y + bob, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    // Billboards
    const track = TRACKS[currentTrackKey];
    for (const b of state.billboards) {
      let y = (b.y + off * 0.9) % totalY;
      if (y < -80) y += totalY;
      if (y > H + 20 || y < -80) continue;
      const bw = 80, bh = 30;
      const bx = b.side === 'L'
        ? Math.max(6, state.roadX - bw - 14)
        : Math.min(W - bw - 6, state.roadX + state.roadWidth + 14);
      // Post
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(bx + bw/2 - 2, y + bh, 4, 18);
      // Board
      ctx.fillStyle = '#0d0d0d';
      ctx.fillRect(bx - 2, y - 2, bw + 4, bh + 4);
      ctx.fillStyle = b.color;
      ctx.fillRect(bx, y, bw, bh);
      ctx.fillStyle = '#0a0a0a';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(b.text, bx + bw/2, y + bh/2);
    }
  }

  function drawRoad() {
    const track = TRACKS[currentTrackKey];

    // Grass / outer environment
    ctx.fillStyle = track.grass1;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = track.grass2;
    const stripeH = 60;
    for (let i = -1; i < Math.ceil(H / stripeH) + 1; i++) {
      const y = (i * stripeH * 2 - (state.roadOffset * 0.5) % (stripeH * 2));
      ctx.fillRect(0, y, state.roadX - 10, stripeH);
      ctx.fillRect(state.roadX + state.roadWidth + 10, y, W - state.roadX - state.roadWidth - 10, stripeH);
    }

    drawCrowdAndBillboards();

    // Asphalt
    ctx.fillStyle = track.asphalt;
    ctx.fillRect(state.roadX, 0, state.roadWidth, H);

    // Rain wet shine on road
    if (weather === 'rain') {
      ctx.fillStyle = 'rgba(40,80,120,0.18)';
      ctx.fillRect(state.roadX, 0, state.roadWidth, H);
    }

    // Curbs (or walls for Monaco)
    const curbH = 24;
    const curbW = track.wall ? 14 : 10;
    if (track.wall) {
      // White Armco walls for Monaco
      ctx.fillStyle = '#e8e8e8';
      ctx.fillRect(state.roadX - curbW, 0, curbW, H);
      ctx.fillRect(state.roadX + state.roadWidth, 0, curbW, H);
      ctx.fillStyle = '#c0c0c0';
      ctx.fillRect(state.roadX - curbW, 0, curbW, 3);
      ctx.fillRect(state.roadX + state.roadWidth, 0, curbW, 3);
    } else {
      for (let i = -1; i < Math.ceil(H / curbH) + 1; i++) {
        const y = i * curbH - (state.roadOffset % (curbH * 2));
        ctx.fillStyle = (i % 2 === 0) ? track.curb1 : track.curb2;
        ctx.fillRect(state.roadX - curbW, y, curbW, curbH);
        ctx.fillRect(state.roadX + state.roadWidth, y, curbW, curbH);
      }
    }

    // Lane dashes
    ctx.strokeStyle = track.laneColor;
    ctx.lineWidth = 4;
    ctx.setLineDash([34, 28]);
    ctx.lineDashOffset = -state.roadOffset;
    for (let i = 1; i < state.lanes; i++) {
      const x = state.roadX + state.laneWidth * i;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    // Speed lines
    const speedNorm = Math.min(1, state.speed / state.maxSpeed);
    const lineIntensity = state.drsActive ? 1 : speedNorm;
    if (lineIntensity > 0.1) {
      ctx.strokeStyle = state.drsActive ? 'rgba(255, 220, 0, 0.55)' : 'rgba(255,255,255,0.25)';
      ctx.lineWidth = state.drsActive ? 2 : 1.5;
      const lines = Math.floor(8 + lineIntensity * 18);
      for (let i = 0; i < lines; i++) {
        const x = Math.random() * W;
        // Skip lines on the road itself unless DRS (more drama)
        if (!state.drsActive && x > state.roadX - 4 && x < state.roadX + state.roadWidth + 4) continue;
        const len = 18 + Math.random() * 30 * (0.5 + lineIntensity);
        const y = Math.random() * H;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x, y + len);
        ctx.stroke();
      }
    }
  }

  function drawRain() {
    if (weather !== 'rain') return;
    // Update + draw raindrops
    const target = 90;
    while (state.raindrops.length < target) {
      state.raindrops.push({
        x: Math.random() * W,
        y: Math.random() * -H,
        vy: 10 + Math.random() * 8,
        vx: -1.5,
        len: 8 + Math.random() * 10
      });
    }
    ctx.strokeStyle = 'rgba(180,210,255,0.55)';
    ctx.lineWidth = 1.2;
    const effSpeed = state.running ? state.speed : 1;
    for (const d of state.raindrops) {
      d.y += d.vy + effSpeed * 1.5;
      d.x += d.vx;
      if (d.y > H + 10) { d.y = -20; d.x = Math.random() * W; }
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x + d.vx * 0.6, d.y - d.len);
      ctx.stroke();
    }
  }

  function update() {
    if (keys['ArrowLeft'] || keys['a']) state.targetX -= 6;
    if (keys['ArrowRight'] || keys['d']) state.targetX += 6;
    state.targetX = Math.max(
      state.roadX + state.car.w / 2 + 4,
      Math.min(state.roadX + state.roadWidth - state.car.w / 2 - 4, state.targetX)
    );
    // Rain makes steering slipperier
    const steerEase = weather === 'rain' ? 0.16 : 0.24;
    state.car.x += (state.targetX - state.car.x) * steerEase;

    if (!state.paused) {
      if (state.drsActive) {
        state.drsActiveTimer--;
        if (state.drsActiveTimer <= 0) {
          state.drsActive = false;
          state.drsCooldownTimer = DRS_COOLDOWN;
          drsBtn.classList.remove('active');
          drsBtn.classList.add('cooldown');
        }
      } else if (!state.drsAvailable) {
        state.drsCooldownTimer--;
        if (state.drsCooldownTimer <= 0) {
          state.drsAvailable = true;
          drsBtn.classList.remove('cooldown');
        }
      }
    }
    updateDRSUI();

    if (state.running && !state.crashed && !state.paused && !state.won) {
      state.raceFrames++;
      updateTimeUI();

      if (state.speed < state.maxSpeed) state.speed += state.accel;

      const tire = TIRES[state.currentTire];
      const boost = state.drsActive ? state.drsBoost : 1;

      // Slipstream detection (rival directly ahead in same lane area)
      let slip = false;
      for (const o of state.obstacles) {
        if (o.y < state.car.y && o.y > state.car.y - 230) {
          if (Math.abs(o.x - state.car.x) < state.car.w * 0.9) { slip = true; break; }
        }
      }
      if (slip !== state.slipstreaming) {
        state.slipstreaming = slip;
        slipIndicator.classList.toggle('show', slip);
      }
      const slipMult = slip ? 1.12 : 1;
      // Rain reduces max effective speed slightly
      const wetMult = weather === 'rain' ? 0.93 : 1;
      const effSpeed = state.speed * tire.speedMult * boost * slipMult * wetMult;

      state.distance += effSpeed * 0.42;
      state.roadOffset += effSpeed * 4.2;

      const burnMult = state.drsActive ? 1.5 : 1.0;
      state.tireLife -= tire.burn * burnMult;
      if (state.tireLife <= 0) {
        state.tireLife = 0;
        updateTireUI();
        openPitStop();
      } else {
        updateTireUI();
      }

      // Engine pitch
      const speedNorm = effSpeed / (state.maxSpeed * 1.15 * state.drsBoost);
      updateEngine(Math.min(1, speedNorm), state.drsActive);

      state.spawnTimer++;
      if (state.spawnTimer >= state.spawnInterval) {
        state.spawnTimer = 0;
        spawnObstacle();
        state.spawnInterval = Math.max(46, 100 - state.distance * 0.0025);
      }

      for (let i = state.obstacles.length - 1; i >= 0; i--) {
        const o = state.obstacles[i];
        o.y += effSpeed * 5 * o.speed;
        if (o.y > H + 120) {
          state.obstacles.splice(i, 1);
          state.passed++;
          updatePassedUI();
          updatePositionUI();
          soundOvertake();
          spawnParticle(state.car.x, state.car.y - state.car.h / 2 - 8, 0, -1.5, '#00ff66', 20, 3);

          // Sector check
          if (state.passed === SECTOR_CARS || state.passed === SECTOR_CARS * 2) {
            const sectorTime = state.raceFrames - state.sectorStartFrames;
            state.sectorTimes.push(sectorTime);
            state.sectorStartFrames = state.raceFrames;
            state.sectorIndex++;
            showSectorBanner('SECTOR ' + state.sectorIndex + ' ✓', formatTimeSeconds(sectorTime));
          }

          if (state.passed >= WIN_TARGET) {
            const sectorTime = state.raceFrames - state.sectorStartFrames;
            state.sectorTimes.push(sectorTime);
            showSectorBanner('FINISH', formatTimeSeconds(state.raceFrames));
            winRace();
            break;
          }
          continue;
        }
        const dx = Math.abs(o.x - state.car.x);
        const dy = Math.abs(o.y - state.car.y);
        if (dx < (o.w + state.car.w) * 0.40 && dy < (o.h + state.car.h) * 0.40) {
          gameOver();
        }
      }

      const smokeChance = state.drsActive ? 0.9 : 0.5;
      if (Math.random() < smokeChance) {
        const smokeColor = state.drsActive ? 'rgba(255,220,0,0.45)' : 'rgba(255,255,255,0.35)';
        spawnParticle(state.car.x - state.car.w * 0.38, state.car.y + state.car.h * 0.42,
          (Math.random() - 0.5) * 0.6, effSpeed * 0.55, smokeColor, 22, 4);
        spawnParticle(state.car.x + state.car.w * 0.38, state.car.y + state.car.h * 0.42,
          (Math.random() - 0.5) * 0.6, effSpeed * 0.55, smokeColor, 22, 4);
      }

      // Rain spray from player wheels
      if (weather === 'rain' && Math.random() < 0.6) {
        spawnParticle(state.car.x - state.car.w * 0.5, state.car.y + state.car.h * 0.35,
          (Math.random() - 0.5) * 1.2, -effSpeed * 0.4 - 1, 'rgba(180,210,255,0.55)', 18, 2.5);
        spawnParticle(state.car.x + state.car.w * 0.5, state.car.y + state.car.h * 0.35,
          (Math.random() - 0.5) * 1.2, -effSpeed * 0.4 - 1, 'rgba(180,210,255,0.55)', 18, 2.5);
      }

      const ms = Math.floor(state.distance / 500);
      if (ms > state.milestone) {
        state.milestone = ms;
        spawnSparkle(state.car.x, state.car.y - state.car.h / 2);
      }
    } else if (state.countdown) {
      // While lights count down, scroll road slightly for atmosphere
      state.roadOffset += 0.3;
    }

    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.06;
      p.vx *= 0.99;
      p.life--;
      if (p.life <= 0) state.particles.splice(i, 1);
    }
    for (let i = state.sparkles.length - 1; i >= 0; i--) {
      const s = state.sparkles[i];
      s.x += s.vx;
      s.y += s.vy;
      s.vy += 0.12;
      s.vx *= 0.995;
      s.life--;
      if (s.life <= 0) state.sparkles.splice(i, 1);
    }

    if (state.shake > 0.3) state.shake *= 0.88;
    else state.shake = 0;
  }

  function render() {
    ctx.save();
    if (state.shake > 0.3) {
      ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
    }

    drawRoad();

    for (const p of state.particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const o of state.obstacles) {
      drawCar(o.x, o.y, o.w, o.h, o.color, false);
    }

    if (!state.crashed) {
      drawCar(state.car.x, state.car.y, state.car.w, state.car.h, playerColor, true);
    }

    for (const s of state.sparkles) {
      ctx.globalAlpha = Math.max(0, s.life / s.maxLife);
      ctx.fillStyle = s.color || '#ffdd44';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size || 3.2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawRain();

    ctx.restore();

    const tireMult = TIRES[state.currentTire].speedMult;
    const drsMult = state.drsActive ? state.drsBoost : 1;
    const slipMult = state.slipstreaming ? 1.12 : 1;
    const wetMult = weather === 'rain' ? 0.93 : 1;
    const displayedSpeed = state.running && !state.paused && !state.won
      ? Math.floor(state.speed * tireMult * drsMult * slipMult * wetMult * 56)
      : 0;
    document.getElementById('speed').textContent = displayedSpeed;
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('bestTime').textContent = bestWinFrames > 0 ? formatTimeSeconds(bestWinFrames) : '—';
  if (bestWinFrames > 0) document.getElementById('scoreDisplay').classList.remove('hidden');
  updateTireUI();
  updatePassedUI();
  updateTimeUI();
  updatePositionUI();

  loop();
})();
</script>
</body>
</html>
