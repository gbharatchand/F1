<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FF8700">
<title>F1 Dash</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a3d0a; touch-action: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overscroll-behavior: none; }
  canvas { display: block; }
  canvas#game { width: 100vw; height: 100vh; }

  #ui {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: 14px;
    right: 14px;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .top-row { display: flex; justify-content: space-between; gap: 8px; }
  .stat {
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 11px;
    letter-spacing: 2px;
    color: white;
    font-weight: 700;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .stat span.val {
    color: #FF8700;
    font-size: 17px;
    margin-left: 6px;
    font-variant-numeric: tabular-nums;
    font-weight: 800;
  }
  .stat.pass span.val { color: #00ff66; }
  .stat.pass small { color: #888; font-size: 11px; margin-left: 2px; }
  .stat.time span.val { color: #00d2ff; }
  .stat.time small { color: #888; font-size: 11px; }

  /* Tire bar */
  #tireBar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 12px;
    pointer-events: none;
  }
  .tire-letter {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 900;
    flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.3);
  }
  .tire-letter.soft   { background: #ff3030; color: white; }
  .tire-letter.medium { background: #ffd000; color: black; }
  .tire-letter.hard   { background: #e8e8e8; color: black; }
  .tire-bar-bg {
    flex: 1;
    height: 8px;
    background: rgba(255,255,255,0.15);
    border-radius: 4px;
    overflow: hidden;
  }
  .tire-bar-fill {
    height: 100%;
    width: 100%;
    background: #ffd000;
    transition: width 0.15s linear, background 0.3s;
    border-radius: 4px;
  }
  .tire-bar-fill.warn { animation: warnPulse 0.6s infinite alternate; }
  @keyframes warnPulse { from { opacity: 1; } to { opacity: 0.4; } }
  #tirePct {
    font-size: 11px;
    color: #fff;
    font-variant-numeric: tabular-nums;
    min-width: 36px;
    text-align: right;
    letter-spacing: 1px;
  }

  /* Overlays */
  #overlay, #pitstop {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.82);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 20px;
    overflow-y: auto;
  }
  #overlay { z-index: 3; }
  #pitstop { z-index: 4; }
  #overlay.hidden, #pitstop.hidden { display: none; }

  .panel {
    background: linear-gradient(180deg, #1a1a1a, #0d0d0d);
    border: 1px solid #FF8700;
    padding: 24px 22px;
    border-radius: 16px;
    text-align: center;
    color: white;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(255,135,0,0.3);
    transition: border-color 0.3s, box-shadow 0.3s;
    margin: auto;
  }
  .panel.win {
    border-color: #00ff66;
    box-shadow: 0 20px 60px rgba(0, 255, 102, 0.35);
  }
  .panel h1 { color: #FF8700; font-size: 28px; letter-spacing: 6px; margin-bottom: 4px; font-weight: 900; transition: color 0.3s; }
  .panel.win h1 { color: #00ff66; }
  .panel h2 { color: white; font-size: 16px; margin-bottom: 10px; font-weight: 600; }
  .panel p { color: #aaa; font-size: 12.5px; line-height: 1.5; margin-bottom: 14px; }

  /* Tier badge */
  .tier-badge {
    display: none;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 11px;
    letter-spacing: 3px;
    font-weight: 800;
    margin-bottom: 14px;
    border: 1px solid;
  }
  .tier-badge.show { display: inline-block; }
  .tier-badge.pole   { color: #ffd700; background: rgba(255,215,0,0.12); border-color: rgba(255,215,0,0.5); }
  .tier-badge.podium { color: #c0c0c0; background: rgba(192,192,192,0.12); border-color: rgba(192,192,192,0.5); }
  .tier-badge.points { color: #cd7f32; background: rgba(205,127,50,0.12); border-color: rgba(205,127,50,0.5); }
  .tier-badge.finish { color: #888;    background: rgba(136,136,136,0.12); border-color: rgba(136,136,136,0.4); }
  .tier-badge.newbest { color: #00ff66; background: rgba(0,255,102,0.12); border-color: rgba(0,255,102,0.6); }

  .scores { display: flex; justify-content: space-around; margin-bottom: 16px; padding: 12px 0; border-top: 1px solid #2a2a2a; border-bottom: 1px solid #2a2a2a; gap: 6px; }
  .scores.hidden { display: none; }
  .score-block { color: #777; font-size: 9px; letter-spacing: 2px; flex: 1; }
  .score-block strong { display: block; color: white; font-size: 20px; margin-top: 4px; font-variant-numeric: tabular-nums; font-weight: 800; }

  /* Livery picker */
  .picker { margin: 6px 0 16px 0; }
  .picker-label { color: #777; font-size: 10px; letter-spacing: 3px; margin-bottom: 12px; }
  .livery-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px 4px;
    max-width: 360px;
    margin: 0 auto;
  }
  @media (max-width: 380px) {
    .livery-grid { grid-template-columns: repeat(5, 1fr); gap: 4px 2px; }
  }
  .livery-option {
    background: rgba(255,255,255,0.03);
    border: 2px solid transparent;
    border-radius: 10px;
    padding: 6px 2px 4px 2px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
    touch-action: manipulation;
  }
  .livery-option:active { transform: scale(0.94); }
  .livery-option.selected {
    border-color: rgba(255,255,255,0.6);
    background: rgba(255,255,255,0.08);
    box-shadow: 0 0 10px rgba(255,255,255,0.15);
  }
  .livery-car { display: block; pointer-events: none; }
  .livery-name {
    font-size: 8px;
    letter-spacing: 1px;
    color: #888;
    text-transform: uppercase;
    font-weight: 700;
    text-align: center;
    line-height: 1.1;
    margin-top: 2px;
  }
  .livery-option.selected .livery-name { color: #fff; }

  button.cta { background: #FF8700; color: white; border: none; padding: 14px 36px; font-size: 14px; font-weight: 800; letter-spacing: 3px; border-radius: 10px; cursor: pointer; touch-action: manipulation; transition: transform 0.1s, background 0.2s; }
  button.cta:active { transform: scale(0.96); }
  .panel.win button.cta { background: #00ff66; color: #0a3d0a; }

  /* Pit stop panel */
  .pit-panel {
    background: linear-gradient(180deg, #1a1a1a, #0d0d0d);
    border: 1px solid #ffd000;
    padding: 24px 22px;
    border-radius: 16px;
    text-align: center;
    color: white;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(255,208,0,0.25);
  }
  .pit-panel h1 { color: #ffd000; font-size: 24px; letter-spacing: 6px; margin-bottom: 4px; font-weight: 900; }
  .pit-panel h2 { color: #aaa; font-size: 11px; letter-spacing: 3px; margin-bottom: 18px; font-weight: 600; }
  .tire-options { display: flex; flex-direction: column; gap: 10px; }
  .tire-option {
    background: rgba(255,255,255,0.04);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    text-align: left;
    color: white;
    transition: transform 0.1s, background 0.15s;
    touch-action: manipulation;
  }
  .tire-option:active { transform: scale(0.97); background: rgba(255,255,255,0.1); }
  .tire-option.soft   { border-color: rgba(255,48,48,0.6); }
  .tire-option.medium { border-color: rgba(255,208,0,0.6); }
  .tire-option.hard   { border-color: rgba(232,232,232,0.6); }
  .tire-circle { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; border: 3px solid #0d0d0d; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.15); }
  .tire-info { flex: 1; }
  .tire-info strong { display: block; font-size: 14px; letter-spacing: 2px; margin-bottom: 2px; }
  .tire-info span { font-size: 10px; color: #999; letter-spacing: 1px; }

  /* DRS button */
  #drsBtn {
    position: fixed;
    bottom: max(28px, env(safe-area-inset-bottom));
    right: 22px;
    width: 88px;
    height: 88px;
    border-radius: 50%;
    border: 3px solid #00ff66;
    background: rgba(0, 50, 20, 0.85);
    color: #00ff66;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 2px;
    box-shadow: 0 0 18px rgba(0, 255, 102, 0.5), inset 0 0 8px rgba(0,255,102,0.2);
    z-index: 2;
    touch-action: manipulation;
    cursor: pointer;
    transition: transform 0.1s;
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  #drsBtn.visible { display: flex; }
  #drsBtn:active { transform: scale(0.92); }
  #drsBtn.active {
    background: rgba(255, 220, 0, 0.95);
    border-color: #fff;
    color: #1a1a1a;
    box-shadow: 0 0 30px rgba(255, 220, 0, 0.9), inset 0 0 12px rgba(255,255,255,0.4);
    animation: drsPulse 0.4s infinite alternate;
  }
  #drsBtn.cooldown {
    background: rgba(40,40,40,0.7);
    border-color: #555;
    color: #777;
    box-shadow: none;
  }
  @keyframes drsPulse { from { transform: scale(1); } to { transform: scale(1.05); } }
  #drsBtn .timer {
    position: absolute;
    bottom: -22px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.7);
    font-weight: 700;
  }

  .hint { position: fixed; bottom: max(14px, env(safe-area-inset-bottom)); left: 14px; color: rgba(255,255,255,0.5); font-size: 10px; letter-spacing: 2px; pointer-events: none; z-index: 2; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">
  <div class="top-row">
    <div class="stat">SPD<span class="val" id="speed">0</span></div>
    <div class="stat pass">PASS<span class="val" id="passed">0</span><small>/60</small></div>
    <div class="stat time">TIME<span class="val" id="time">0.0</span><small>s</small></div>
  </div>
  <div id="tireBar" class="stat">
    <div class="tire-letter medium" id="tireLetter">M</div>
    <div class="tire-bar-bg"><div class="tire-bar-fill" id="tireFill"></div></div>
    <span id="tirePct">100%</span>
  </div>
</div>
<div class="hint">DRAG TO STEER</div>

<button id="drsBtn" aria-label="DRS Boost">DRS<span class="timer" id="drsTimer"></span></button>

<div id="overlay">
  <div class="panel" id="endPanel">
    <h1 id="title">F1 DASH</h1>
    <h2 id="subtitle">Lights out, go go go.</h2>
    <div class="tier-badge" id="tierBadge"></div>
    <p id="instructions">Drag to steer · tap <strong style="color:#00ff66">DRS</strong> for 3s boost · <strong style="color:#00ff66">pass 20 cars</strong> as fast as you can to win.</p>

    <div class="picker" id="liveryPicker">
      <div class="picker-label">CHOOSE YOUR TEAM</div>
      <div class="livery-grid" id="liveryGrid"></div>
    </div>

    <div class="scores hidden" id="scoreDisplay">
      <div class="score-block">TIME<strong id="finalTime">0.0s</strong></div>
      <div class="score-block">PASSED<strong id="finalPassed">0</strong></div>
      <div class="score-block">BEST<strong id="bestTime">—</strong></div>
    </div>
    <button id="startBtn" class="cta">START</button>
  </div>
</div>

<div id="pitstop" class="hidden">
  <div class="pit-panel">
    <h1>PIT STOP</h1>
    <h2>TIRES BLOWN — CHOOSE COMPOUND</h2>
    <div class="tire-options">
      <button class="tire-option soft" data-tire="soft">
        <div class="tire-circle" style="background:#ff3030"></div>
        <div class="tire-info">
          <strong>SOFT</strong>
          <span>Quickest pace · wears fast</span>
        </div>
      </button>
      <button class="tire-option medium" data-tire="medium">
        <div class="tire-circle" style="background:#ffd000"></div>
        <div class="tire-info">
          <strong>MEDIUM</strong>
          <span>Balanced pace and life</span>
        </div>
      </button>
      <button class="tire-option hard" data-tire="hard">
        <div class="tire-circle" style="background:#e8e8e8"></div>
        <div class="tire-info">
          <strong>HARD</strong>
          <span>Slower · lasts much longer</span>
        </div>
      </button>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const drsBtn = document.getElementById('drsBtn');
  const drsTimerEl = document.getElementById('drsTimer');
  const tireFillEl = document.getElementById('tireFill');
  const tirePctEl = document.getElementById('tirePct');
  const tireLetterEl = document.getElementById('tireLetter');
  const passedEl = document.getElementById('passed');
  const timeEl = document.getElementById('time');
  let W, H, dpr;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    setupRoad();
  }

  let best = 0;
  try { best = parseInt(localStorage.getItem('f1dash_best') || '0', 10); } catch(e) {}
  let bestWinFrames = 0;
  try { bestWinFrames = parseInt(localStorage.getItem('f1dash_bestTime') || '0', 10); } catch(e) {}

  // ---- F1 teams (current grid colors) ----
  const F1_TEAMS = [
    { name: 'McLaren',      color: '#FF8700' },
    { name: 'Ferrari',      color: '#DC0000' },
    { name: 'Mercedes',     color: '#27F4D2' },
    { name: 'Red Bull',     color: '#3671C6' },
    { name: 'Aston',        color: '#229971' },
    { name: 'Alpine',       color: '#FF87BC' },
    { name: 'Williams',     color: '#64C4FF' },
    { name: 'Haas',         color: '#B6BABD' },
    { name: 'Sauber',       color: '#52E252' },
    { name: 'RB',           color: '#6692FF' }
  ];

  let playerColor = '#FF8700';
  try {
    const saved = localStorage.getItem('f1dash_color');
    if (saved && F1_TEAMS.some(t => t.color === saved)) playerColor = saved;
  } catch(e) {}

  const WIN_TARGET = 60;

  const TIRES = {
    soft:   { name: 'SOFT',   letter: 'S', burn: 0.083, speedMult: 1.15, color: '#ff3030' },
    medium: { name: 'MEDIUM', letter: 'M', burn: 0.042, speedMult: 1.00, color: '#ffd000' },
    hard:   { name: 'HARD',   letter: 'H', burn: 0.022, speedMult: 0.85, color: '#e8e8e8' }
  };

  const state = {
    running: false,
    crashed: false,
    paused: false,
    won: false,
    car: { x: 0, y: 0, w: 48, h: 82 },
    targetX: 0,
    speed: 0,
    maxSpeed: 5.5,
    accel: 0.00175,
    distance: 0,
    roadOffset: 0,
    obstacles: [],
    particles: [],
    sparkles: [],
    spawnTimer: 0,
    spawnInterval: 100,
    lanes: 3,
    roadWidth: 0,
    laneWidth: 0,
    roadX: 0,
    shake: 0,
    milestone: 0,
    lastLane: -1,
    passed: 0,
    raceFrames: 0,
    drsActive: false,
    drsAvailable: true,
    drsActiveTimer: 0,
    drsCooldownTimer: 0,
    drsBoost: 1.8,
    tireLife: 100,
    currentTire: 'medium'
  };

  const DRS_DURATION = 180;
  const DRS_COOLDOWN = 180;

  function setupRoad() {
    state.roadWidth = Math.min(W * 0.86, 420);
    state.roadX = (W - state.roadWidth) / 2;
    state.laneWidth = state.roadWidth / state.lanes;
    state.car.w = Math.min(50, state.laneWidth * 0.6);
    state.car.h = state.car.w * 1.75;
    if (state.car.x === 0) state.car.x = W / 2;
    state.car.y = H - 140;
    if (state.targetX === 0) state.targetX = W / 2;
  }
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 100));

  // ---- Mini car drawer for livery picker ----
  function drawMiniCar(c, color, w, h) {
    c.clearRect(0, 0, w, h);
    c.save();
    c.translate(w / 2, h / 2);
    const carW = w * 0.72;
    const carH = h * 0.86;

    // Shadow
    c.fillStyle = 'rgba(0,0,0,0.4)';
    c.beginPath();
    c.ellipse(0, carH * 0.48, carW * 0.5, carH * 0.08, 0, 0, Math.PI * 2);
    c.fill();

    // Wheels
    c.fillStyle = '#0a0a0a';
    c.fillRect(-carW * 0.55, -carH * 0.30, carW * 0.10, carH * 0.18);
    c.fillRect(carW * 0.55 - carW * 0.10, -carH * 0.30, carW * 0.10, carH * 0.18);
    c.fillRect(-carW * 0.60, carH * 0.18, carW * 0.14, carH * 0.22);
    c.fillRect(carW * 0.60 - carW * 0.14, carH * 0.18, carW * 0.14, carH * 0.22);

    // Body
    c.fillStyle = color;
    c.beginPath();
    c.moveTo(-carW * 0.16, -carH / 2);
    c.lineTo(carW * 0.16, -carH / 2);
    c.lineTo(carW * 0.30, -carH * 0.18);
    c.lineTo(carW * 0.30, carH * 0.05);
    c.lineTo(carW * 0.48, carH * 0.32);
    c.lineTo(carW * 0.42, carH * 0.48);
    c.lineTo(-carW * 0.42, carH * 0.48);
    c.lineTo(-carW * 0.48, carH * 0.32);
    c.lineTo(-carW * 0.30, carH * 0.05);
    c.lineTo(-carW * 0.30, -carH * 0.18);
    c.closePath();
    c.fill();

    // Stripe
    c.fillStyle = 'rgba(255,255,255,0.85)';
    c.fillRect(-carW * 0.04, -carH * 0.45, carW * 0.08, carH * 0.85);

    // Cockpit
    c.fillStyle = '#080808';
    c.beginPath();
    c.ellipse(0, -carH * 0.02, carW * 0.16, carH * 0.16, 0, 0, Math.PI * 2);
    c.fill();

    // Halo
    c.strokeStyle = '#1a1a1a';
    c.lineWidth = 1.5;
    c.beginPath();
    c.arc(0, -carH * 0.02, carW * 0.22, 0, Math.PI * 2);
    c.stroke();

    // Wings
    c.fillStyle = color;
    c.fillRect(-carW * 0.5, -carH / 2 - 4, carW, 5);
    c.fillStyle = '#0a0a0a';
    c.fillRect(-carW * 0.5, -carH / 2 - 4, carW, 1.2);
    c.fillStyle = '#1a1a1a';
    c.fillRect(-carW * 0.5, carH * 0.49, carW, 3.5);
    c.fillStyle = color;
    c.fillRect(-carW * 0.46, carH * 0.49 + 3.5, carW * 0.92, 2.5);

    c.restore();
  }

  // ---- Build livery picker ----
  function buildLiveryPicker() {
    const grid = document.getElementById('liveryGrid');
    grid.innerHTML = '';
    F1_TEAMS.forEach(team => {
      const opt = document.createElement('button');
      opt.className = 'livery-option';
      opt.dataset.color = team.color;
      opt.dataset.team = team.name;
      if (team.color === playerColor) opt.classList.add('selected');

      const cv = document.createElement('canvas');
      const cwPx = 50, chPx = 70;
      const ratio = window.devicePixelRatio || 1;
      cv.width = cwPx * ratio;
      cv.height = chPx * ratio;
      cv.style.width = cwPx + 'px';
      cv.style.height = chPx + 'px';
      cv.className = 'livery-car';
      const c = cv.getContext('2d');
      c.setTransform(ratio, 0, 0, ratio, 0, 0);
      drawMiniCar(c, team.color, cwPx, chPx);

      const name = document.createElement('div');
      name.className = 'livery-name';
      name.textContent = team.name;

      opt.appendChild(cv);
      opt.appendChild(name);
      grid.appendChild(opt);
    });

    grid.addEventListener('click', e => {
      const opt = e.target.closest('.livery-option');
      if (!opt) return;
      grid.querySelectorAll('.livery-option').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      playerColor = opt.dataset.color;
      try {
        localStorage.setItem('f1dash_color', playerColor);
        localStorage.setItem('f1dash_team', opt.dataset.team);
      } catch(e) {}
      document.querySelector('meta[name="theme-color"]').setAttribute('content', playerColor);
    });
  }
  buildLiveryPicker();

  // ---- Steering ----
  let dragging = false;
  function setTarget(clientX) {
    state.targetX = Math.max(
      state.roadX + state.car.w / 2 + 4,
      Math.min(state.roadX + state.roadWidth - state.car.w / 2 - 4, clientX)
    );
  }
  canvas.addEventListener('touchstart', e => { e.preventDefault(); dragging = true; setTarget(e.touches[0].clientX); }, { passive: false });
  canvas.addEventListener('touchmove', e => { e.preventDefault(); if (dragging) setTarget(e.touches[0].clientX); }, { passive: false });
  canvas.addEventListener('touchend', () => dragging = false);
  canvas.addEventListener('mousedown', e => { dragging = true; setTarget(e.clientX); });
  canvas.addEventListener('mousemove', e => { if (dragging) setTarget(e.clientX); });
  window.addEventListener('mouseup', () => dragging = false);

  const keys = {};
  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ' || e.key === 'Shift') { e.preventDefault(); pressDRS(); }
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  // ---- DRS ----
  function pressDRS() {
    if (!state.running || state.crashed || state.paused || state.won) return;
    if (!state.drsAvailable) return;
    state.drsActive = true;
    state.drsActiveTimer = DRS_DURATION;
    state.drsAvailable = false;
    drsBtn.classList.remove('cooldown');
    drsBtn.classList.add('active');
  }
  drsBtn.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); pressDRS(); }, { passive: false });
  drsBtn.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); pressDRS(); });

  function updateDRSUI() {
    if (state.drsActive) {
      drsTimerEl.textContent = (state.drsActiveTimer / 60).toFixed(1) + 'S';
    } else if (!state.drsAvailable) {
      drsTimerEl.textContent = (state.drsCooldownTimer / 60).toFixed(1) + 'S';
    } else {
      drsTimerEl.textContent = 'READY';
    }
  }

  function updateTireUI() {
    const tire = TIRES[state.currentTire];
    const pct = Math.max(0, state.tireLife);
    tireFillEl.style.width = pct + '%';
    tireFillEl.style.background = tire.color;
    tireFillEl.classList.toggle('warn', pct < 20);
    tirePctEl.textContent = Math.round(pct) + '%';
    tireLetterEl.className = 'tire-letter ' + state.currentTire;
    tireLetterEl.textContent = tire.letter;
  }
  function updatePassedUI() { passedEl.textContent = state.passed; }
  function updateTimeUI() { timeEl.textContent = (state.raceFrames / 60).toFixed(1); }

  // ---- Pit stop ----
  function openPitStop() {
    state.paused = true;
    state.drsActive = false;
    drsBtn.classList.remove('active', 'cooldown', 'visible');
    document.getElementById('pitstop').classList.remove('hidden');
  }
  function applyTire(compound) {
    state.currentTire = compound;
    state.tireLife = 100;
    state.paused = false;
    state.drsAvailable = true;
    state.drsActiveTimer = 0;
    state.drsCooldownTimer = 0;
    document.getElementById('pitstop').classList.add('hidden');
    drsBtn.classList.add('visible');
    updateTireUI();
  }
  document.querySelectorAll('.tire-option').forEach(btn => {
    btn.addEventListener('click', () => applyTire(btn.dataset.tire));
  });

  // ---- Spawning ----
  function spawnObstacle() {
    let lane;
    do {
      lane = Math.floor(Math.random() * state.lanes);
    } while (lane === state.lastLane && Math.random() < 0.7);
    state.lastLane = lane;
    const x = state.roadX + state.laneWidth * (lane + 0.5);
    // Use a different set of colors for rival cars so the player's chosen color stands out
    const rivalColors = ['#27F4D2', '#3671C6', '#229971', '#64C4FF', '#FF87BC', '#52E252', '#B6BABD', '#6692FF', '#DC0000', '#FF8700'];
    // Filter out the player's color so rivals look distinct
    const pool = rivalColors.filter(c => c !== playerColor);
    state.obstacles.push({
      x, y: -110, w: state.car.w, h: state.car.h,
      color: pool[Math.floor(Math.random() * pool.length)],
      speed: 0.85 + Math.random() * 0.3
    });
  }

  function spawnParticle(x, y, vx, vy, color, life, size) {
    state.particles.push({ x, y, vx, vy, color, life, maxLife: life, size });
  }
  function spawnSparkle(x, y) {
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 2 + Math.random() * 5;
      state.sparkles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 50, maxLife: 50, color: '#ffdd44', size: 3.2
      });
    }
  }
  function spawnConfetti(intensity) {
    intensity = intensity || 1;
    const colors = ['#00ff66', '#ffd000', '#ff3030', '#1e90ff', '#ff8c00', '#ffffff', '#ff3ea0', '#9b59b6', '#FF8700'];
    const count = Math.floor(120 * intensity);
    for (let i = 0; i < count; i++) {
      state.sparkles.push({
        x: Math.random() * W,
        y: -20 - Math.random() * 60,
        vx: (Math.random() - 0.5) * 4,
        vy: 2 + Math.random() * 5,
        life: 200 + Math.random() * 60,
        maxLife: 200,
        color: colors[Math.floor(Math.random() * colors.length)],
        size: 3 + Math.random() * 4
      });
    }
  }

  // ---- Tier system based on time ----
  function getTier(frames) {
    const s = frames / 60;
    if (s < 75)   return { name: 'POLE POSITION', cls: 'pole' };
    if (s < 100)  return { name: 'PODIUM', cls: 'podium' };
    if (s < 130)  return { name: 'POINTS FINISH', cls: 'points' };
    return { name: 'FINISH', cls: 'finish' };
  }

  function formatTimeSeconds(frames) {
    return (frames / 60).toFixed(2) + 's';
  }

  // ---- Game flow ----
  function reset() {
    state.obstacles = [];
    state.particles = [];
    state.sparkles = [];
    state.distance = 0;
    state.speed = 2.3;
    state.spawnTimer = 0;
    state.spawnInterval = 100;
    state.crashed = false;
    state.paused = false;
    state.won = false;
    state.shake = 0;
    state.milestone = 0;
    state.lastLane = -1;
    state.passed = 0;
    state.raceFrames = 0;
    state.car.x = W / 2;
    state.targetX = W / 2;
    state.drsActive = false;
    state.drsAvailable = true;
    state.drsActiveTimer = 0;
    state.drsCooldownTimer = 0;
    state.tireLife = 100;
    state.currentTire = 'medium';
    drsBtn.classList.remove('active', 'cooldown');
    document.getElementById('endPanel').classList.remove('win');
    const badge = document.getElementById('tierBadge');
    badge.classList.remove('show', 'pole', 'podium', 'points', 'finish', 'newbest');
    updateTireUI();
    updatePassedUI();
    updateTimeUI();
  }

  function start() {
    reset();
    state.running = true;
    document.getElementById('overlay').classList.add('hidden');
    document.getElementById('scoreDisplay').classList.remove('hidden');
    document.getElementById('liveryPicker').style.display = 'none';
    drsBtn.classList.add('visible');
  }

  function endRace({ won }) {
    state.running = false;
    drsBtn.classList.remove('visible');
    const score = Math.floor(state.distance);
    const isNewBestDist = score > best;
    if (isNewBestDist) {
      best = score;
      try { localStorage.setItem('f1dash_best', best); } catch(e) {}
    }
    const finishFrames = state.raceFrames;
    const isNewBestTime = won && (bestWinFrames === 0 || finishFrames < bestWinFrames);
    if (isNewBestTime) {
      bestWinFrames = finishFrames;
      try { localStorage.setItem('f1dash_bestTime', bestWinFrames); } catch(e) {}
    }

    document.getElementById('finalTime').textContent = formatTimeSeconds(finishFrames);
    document.getElementById('finalPassed').textContent = state.passed;
    document.getElementById('bestTime').textContent = bestWinFrames > 0 ? formatTimeSeconds(bestWinFrames) : '—';

    const endPanel = document.getElementById('endPanel');
    const badge = document.getElementById('tierBadge');
    badge.classList.remove('show', 'pole', 'podium', 'points', 'finish', 'newbest');

    if (won) {
      endPanel.classList.add('win');
      const tier = getTier(finishFrames);
      document.getElementById('title').textContent = 'P1 — CHECKERED FLAG';
      document.getElementById('subtitle').textContent = isNewBestTime
        ? 'New personal best!'
        : 'You took the win.';
      badge.classList.add('show', isNewBestTime ? 'newbest' : tier.cls);
      badge.textContent = isNewBestTime ? '★ NEW BEST · ' + tier.name : tier.name;

      const delta = bestWinFrames > 0 && !isNewBestTime
        ? '<br><span style="color:#888;font-size:11px;">+ ' + ((finishFrames - bestWinFrames) / 60).toFixed(2) + 's off your best</span>'
        : '';
      document.getElementById('instructions').innerHTML =
        'Overtook <strong style="color:#00ff66">' + WIN_TARGET + '</strong> cars in <strong style="color:#00d2ff">' + formatTimeSeconds(finishFrames) + '</strong>.' + delta;
    } else {
      endPanel.classList.remove('win');
      document.getElementById('title').textContent = 'WRECKED.';
      document.getElementById('subtitle').textContent = isNewBestDist ? 'New best distance.' : 'You crashed out.';
      document.getElementById('instructions').innerHTML =
        'Passed <strong style="color:#00ff66">' + state.passed + '</strong> of ' + WIN_TARGET + ' before the wreck. Drag to steer · <strong style="color:#00ff66">DRS</strong> for boost · pit to swap tires.';
    }
    document.getElementById('startBtn').textContent = 'RACE AGAIN';
    document.getElementById('overlay').classList.remove('hidden');
  }

  function winRace() {
    if (state.crashed || state.won) return;
    state.won = true;
    state.drsActive = false;
    drsBtn.classList.remove('active', 'cooldown');
    const tier = getTier(state.raceFrames);
    const intensity = tier.cls === 'pole' ? 2 : (tier.cls === 'podium' ? 1.4 : 1);
    spawnConfetti(intensity);
    setTimeout(() => spawnConfetti(intensity), 500);
    setTimeout(() => endRace({ won: true }), 1500);
  }

  function gameOver() {
    if (state.crashed || state.won) return;
    state.crashed = true;
    state.shake = 22;
    drsBtn.classList.remove('active', 'cooldown');
    state.drsActive = false;

    for (let i = 0; i < 50; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 2 + Math.random() * 7;
      const palette = ['#ff4500', '#ffdd00', '#ff8800', '#ff2200'];
      spawnParticle(state.car.x, state.car.y, Math.cos(a) * sp, Math.sin(a) * sp - 2,
        palette[Math.floor(Math.random() * palette.length)], 50 + Math.random() * 40, 2 + Math.random() * 4);
    }
    for (let i = 0; i < 20; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 3;
      spawnParticle(state.car.x, state.car.y, Math.cos(a) * sp, Math.sin(a) * sp - 1, 'rgba(80,80,80,0.7)', 70, 5);
    }

    setTimeout(() => endRace({ won: false }), 1300);
  }

  // ---- In-game car drawer ----
  function drawCar(x, y, w, h, color, isPlayer) {
    ctx.save();
    ctx.translate(x, y);

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(0, h * 0.48, w * 0.55, h * 0.12, 0, 0, Math.PI * 2);
    ctx.fill();

    const wheelColor = isPlayer ? TIRES[state.currentTire].color : '#0a0a0a';
    const wheelStroke = isPlayer ? '#0a0a0a' : null;
    ctx.fillStyle = wheelColor;
    ctx.fillRect(-w * 0.55, -h * 0.30, 7, h * 0.20);
    ctx.fillRect(w * 0.55 - 7, -h * 0.30, 7, h * 0.20);
    ctx.fillRect(-w * 0.6, h * 0.18, 9, h * 0.24);
    ctx.fillRect(w * 0.6 - 9, h * 0.18, 9, h * 0.24);
    if (wheelStroke) {
      ctx.strokeStyle = wheelStroke; ctx.lineWidth = 1;
      ctx.strokeRect(-w * 0.55, -h * 0.30, 7, h * 0.20);
      ctx.strokeRect(w * 0.55 - 7, -h * 0.30, 7, h * 0.20);
      ctx.strokeRect(-w * 0.6, h * 0.18, 9, h * 0.24);
      ctx.strokeRect(w * 0.6 - 9, h * 0.18, 9, h * 0.24);
    }

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-w * 0.16, -h / 2);
    ctx.lineTo(w * 0.16, -h / 2);
    ctx.lineTo(w * 0.30, -h * 0.18);
    ctx.lineTo(w * 0.30, h * 0.05);
    ctx.lineTo(w * 0.48, h * 0.32);
    ctx.lineTo(w * 0.42, h * 0.48);
    ctx.lineTo(-w * 0.42, h * 0.48);
    ctx.lineTo(-w * 0.48, h * 0.32);
    ctx.lineTo(-w * 0.30, h * 0.05);
    ctx.lineTo(-w * 0.30, -h * 0.18);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = isPlayer ? '#ffffff' : 'rgba(0,0,0,0.25)';
    ctx.fillRect(-w * 0.04, -h * 0.45, w * 0.08, h * 0.85);

    ctx.fillStyle = '#080808';
    ctx.beginPath();
    ctx.ellipse(0, -h * 0.02, w * 0.16, h * 0.16, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, -h * 0.02, w * 0.22, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = color;
    ctx.fillRect(-w * 0.5, -h / 2 - 5, w, 6);
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(-w * 0.5, -h / 2 - 5, w, 1.5);

    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-w * 0.5, h * 0.49, w, 4);
    ctx.fillStyle = color;
    ctx.fillRect(-w * 0.46, h * 0.49 + 4, w * 0.92, 3);

    if (isPlayer) {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, h * 0.28, w * 0.13, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = color;
      ctx.font = 'bold ' + Math.round(w * 0.20) + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('1', 0, h * 0.29);

      if (state.drsActive) {
        ctx.fillStyle = '#ffdd00';
        ctx.fillRect(-w * 0.42, h * 0.44, w * 0.84, 3);
        ctx.fillStyle = 'rgba(255, 220, 0, 0.3)';
        ctx.fillRect(-w * 0.5, h * 0.5, w, 8);
      }
    }

    ctx.restore();
  }

  function drawRoad() {
    ctx.fillStyle = '#0a3d0a';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#0d4d0d';
    const stripeH = 60;
    for (let i = -1; i < Math.ceil(H / stripeH) + 1; i++) {
      const y = (i * stripeH * 2 - (state.roadOffset * 0.5) % (stripeH * 2));
      ctx.fillRect(0, y, state.roadX - 10, stripeH);
      ctx.fillRect(state.roadX + state.roadWidth + 10, y, W - state.roadX - state.roadWidth - 10, stripeH);
    }

    ctx.fillStyle = '#1f1f1f';
    ctx.fillRect(state.roadX, 0, state.roadWidth, H);

    const curbH = 24;
    const curbW = 10;
    for (let i = -1; i < Math.ceil(H / curbH) + 1; i++) {
      const y = i * curbH - (state.roadOffset % (curbH * 2));
      ctx.fillStyle = (i % 2 === 0) ? '#e02020' : '#f5f5f5';
      ctx.fillRect(state.roadX - curbW, y, curbW, curbH);
      ctx.fillRect(state.roadX + state.roadWidth, y, curbW, curbH);
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 4;
    ctx.setLineDash([34, 28]);
    ctx.lineDashOffset = -state.roadOffset;
    for (let i = 1; i < state.lanes; i++) {
      const x = state.roadX + state.laneWidth * i;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    if (state.drsActive) {
      ctx.strokeStyle = 'rgba(255, 220, 0, 0.18)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 14; i++) {
        const x = state.roadX + Math.random() * state.roadWidth;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }
    } else {
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 6; i++) {
        const x = state.roadX + Math.random() * state.roadWidth;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }
    }
  }

  function update() {
    if (keys['ArrowLeft'] || keys['a']) state.targetX -= 6;
    if (keys['ArrowRight'] || keys['d']) state.targetX += 6;
    state.targetX = Math.max(
      state.roadX + state.car.w / 2 + 4,
      Math.min(state.roadX + state.roadWidth - state.car.w / 2 - 4, state.targetX)
    );
    state.car.x += (state.targetX - state.car.x) * 0.24;

    if (!state.paused) {
      if (state.drsActive) {
        state.drsActiveTimer--;
        if (state.drsActiveTimer <= 0) {
          state.drsActive = false;
          state.drsCooldownTimer = DRS_COOLDOWN;
          drsBtn.classList.remove('active');
          drsBtn.classList.add('cooldown');
        }
      } else if (!state.drsAvailable) {
        state.drsCooldownTimer--;
        if (state.drsCooldownTimer <= 0) {
          state.drsAvailable = true;
          drsBtn.classList.remove('cooldown');
        }
      }
    }
    updateDRSUI();

    if (state.running && !state.crashed && !state.paused && !state.won) {
      state.raceFrames++;
      updateTimeUI();

      if (state.speed < state.maxSpeed) state.speed += state.accel;

      const tire = TIRES[state.currentTire];
      const boost = state.drsActive ? state.drsBoost : 1;
      const effSpeed = state.speed * tire.speedMult * boost;

      state.distance += effSpeed * 0.42;
      state.roadOffset += effSpeed * 4.2;

      const burnMult = state.drsActive ? 1.5 : 1.0;
      state.tireLife -= tire.burn * burnMult;
      if (state.tireLife <= 0) {
        state.tireLife = 0;
        updateTireUI();
        openPitStop();
      } else {
        updateTireUI();
      }

      state.spawnTimer++;
      if (state.spawnTimer >= state.spawnInterval) {
        state.spawnTimer = 0;
        spawnObstacle();
        state.spawnInterval = Math.max(46, 100 - state.distance * 0.0025);
      }

      for (let i = state.obstacles.length - 1; i >= 0; i--) {
        const o = state.obstacles[i];
        o.y += effSpeed * 5 * o.speed;
        if (o.y > H + 120) {
          state.obstacles.splice(i, 1);
          state.passed++;
          updatePassedUI();
          spawnParticle(state.car.x, state.car.y - state.car.h / 2 - 8, 0, -1.5, '#00ff66', 20, 3);
          if (state.passed >= WIN_TARGET) {
            winRace();
            break;
          }
          continue;
        }
        const dx = Math.abs(o.x - state.car.x);
        const dy = Math.abs(o.y - state.car.y);
        if (dx < (o.w + state.car.w) * 0.40 && dy < (o.h + state.car.h) * 0.40) {
          gameOver();
        }
      }

      const smokeChance = state.drsActive ? 0.9 : 0.5;
      if (Math.random() < smokeChance) {
        const smokeColor = state.drsActive ? 'rgba(255,220,0,0.45)' : 'rgba(255,255,255,0.35)';
        spawnParticle(state.car.x - state.car.w * 0.38, state.car.y + state.car.h * 0.42,
          (Math.random() - 0.5) * 0.6, effSpeed * 0.55, smokeColor, 22, 4);
        spawnParticle(state.car.x + state.car.w * 0.38, state.car.y + state.car.h * 0.42,
          (Math.random() - 0.5) * 0.6, effSpeed * 0.55, smokeColor, 22, 4);
      }

      const ms = Math.floor(state.distance / 500);
      if (ms > state.milestone) {
        state.milestone = ms;
        spawnSparkle(state.car.x, state.car.y - state.car.h / 2);
      }
    }

    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.06;
      p.vx *= 0.99;
      p.life--;
      if (p.life <= 0) state.particles.splice(i, 1);
    }
    for (let i = state.sparkles.length - 1; i >= 0; i--) {
      const s = state.sparkles[i];
      s.x += s.vx;
      s.y += s.vy;
      s.vy += 0.12;
      s.vx *= 0.995;
      s.life--;
      if (s.life <= 0) state.sparkles.splice(i, 1);
    }

    if (state.shake > 0.3) state.shake *= 0.88;
    else state.shake = 0;
  }

  function render() {
    ctx.save();
    if (state.shake > 0.3) {
      ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
    }

    drawRoad();

    for (const p of state.particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const o of state.obstacles) {
      drawCar(o.x, o.y, o.w, o.h, o.color, false);
    }

    if (!state.crashed) {
      drawCar(state.car.x, state.car.y, state.car.w, state.car.h, playerColor, true);
    }

    for (const s of state.sparkles) {
      ctx.globalAlpha = Math.max(0, s.life / s.maxLife);
      ctx.fillStyle = s.color || '#ffdd44';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size || 3.2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.restore();

    const tireMult = TIRES[state.currentTire].speedMult;
    const drsMult = state.drsActive ? state.drsBoost : 1;
    const displayedSpeed = state.running && !state.paused && !state.won
      ? Math.floor(state.speed * tireMult * drsMult * 56)
      : 0;
    document.getElementById('speed').textContent = displayedSpeed;
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  document.getElementById('startBtn').addEventListener('click', start);
  // Show best time on initial screen if there is one
  document.getElementById('bestTime').textContent = bestWinFrames > 0 ? formatTimeSeconds(bestWinFrames) : '—';
  if (bestWinFrames > 0) document.getElementById('scoreDisplay').classList.remove('hidden');
  updateTireUI();
  updatePassedUI();
  updateTimeUI();

  loop();
})();
</script>
</body>
</html>
