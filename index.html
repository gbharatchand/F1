<!DOCTYPE html>
<html>
<head>
  <title>Bharat's Game World</title>

  <style>
    body{
      font-family: Arial;
      background: linear-gradient(180deg,#0f172a,#111827);
      color:white;
      text-align:center;
      padding:40px;
      margin:0;
    }

    h1{
      color:#ff8700;
      font-size:48px;
      margin-bottom:10px;
    }

    p{
      color:#cbd5e1;
      margin-bottom:40px;
      font-size:18px;
    }

    .games{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:25px;
    }

    .card{
      width:260px;
      background:#1e293b;
      border-radius:20px;
      padding:30px;
      text-decoration:none;
      color:white;
      transition:0.3s;
      box-shadow:0 8px 20px rgba(0,0,0,0.4);
    }

    .card:hover{
      transform:translateY(-8px) scale(1.03);
      background:#334155;
    }

    .emoji{
      font-size:60px;
      margin-bottom:20px;
    }

    .title{
      font-size:26px;
      font-weight:bold;
      margin-bottom:10px;
      color:#ff8700;
    }

    .desc{
      color:#cbd5e1;
      font-size:14px;
      line-height:1.5;
    }
  </style>
</head>

<body>

<h1>🎮 Bharat's Game World</h1>

<p>Choose a game and start playing!</p>

<div class="games">

  <a class="card" href="f1.html">
    <div class="emoji">🏎️</div>
    <div class="title">F1 Dash</div>
    <div class="desc">
      Race through traffic and become the champion.
    </div>
  </a>

  <a class="card" href="Flagballons/">
    <div class="emoji">🎈</div>
    <div class="title">Flag Balloons</div>
    <div class="desc">
      Pop balloons and learn country flags.
    </div>
  </a>

  <a class="card" href="puzzle/">
    <div class="emoji">🧩</div>
    <div class="title">Puzzle Game</div>
    <div class="desc">
      Solve fun puzzles for kids.
    </div>
  </a>

</div>

</body>
</html>
