/* ============================================================
   SOUND
   ============================================================ */

let audio = null;
function initAudio(){
  if(audio) return;
  try{ audio = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
}
function beep(freq,dur,type="sine",vol=.22){
  if(!audio || muted) return;
  const t = audio.currentTime;
  const o = audio.createOscillator();
  const g = audio.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(vol,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(audio.destination);
  o.start(t);
  o.stop(t+dur+.02);
}
const Snd = {
  pick(){ beep(520,.08,"triangle",.18); },
  snap(){ beep(440,.07,"square",.18); beep(660,.12,"sine",.2); },
  win(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.18,"triangle",.25),i*120)); },
  cheer(){ for(let i=0;i<10;i++) setTimeout(()=>beep(700+Math.random()*500,.1,"sine",.12),i*70); }
};

/* ============================================================
   VOICE
   ============================================================ */

let voice = null;
function pickVoice(){
  if(!("speechSynthesis" in window)) return;
  const all = speechSynthesis.getVoices();
  if(!all.length) return;
  const en = all.filter(v=>/^en[-_]?/i.test(v.lang));
  const prefs = [/natural/i,/google us english/i,/google uk english female/i,/samantha/i,/karen/i,/tessa/i,/aria/i,/jenny/i,/female/i];
  for(const re of prefs){
    const m = en.find(v=>re.test(v.name));
    if(m){ voice = m; return; }
  }
  voice = en[0] || all[0];
}
if("speechSynthesis" in window){
  pickVoice();
  speechSynthesis.addEventListener("voiceschanged",pickVoice);
}
function say(text){
  if(muted || !("speechSynthesis" in window)) return;
  try{
    if(!voice) pickVoice();
    const u = new SpeechSynthesisUtterance(text);
    if(voice) u.voice = voice;
    u.lang = "en-US";
    u.rate = .92;
    u.pitch = 1.12;
    u.volume = 1;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ============================================================
   IMAGE LOADING
   If an image name is wrong, a friendly placeholder is shown.
   ============================================================ */

const imageCache = {};
function loadImage(src){
  if(imageCache[src]) return imageCache[src];
  imageCache[src] = new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>{ console.log("Loaded image:",src); resolve(img); };
    img.onerror = ()=>{ console.error("Image failed to load:",src); reject(new Error("Image failed to load: " + src)); };
    img.src = src;
  });
  return imageCache[src];
}

function drawPlaceholder(ctx,name){
  ctx.fillStyle = "#fff7d6";
  ctx.fillRect(0,0,boardW,boardH);
  ctx.fillStyle = "#bfe6ff";
  ctx.beginPath();
  ctx.arc(boardW*.50, boardH*.36, Math.min(boardW,boardH)*.22, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = "#3a2b5c";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "bold " + Math.floor(boardH*.18) + "px Comic Sans MS, Arial";
  ctx.fillText("🧩", boardW*.50, boardH*.35);
  ctx.font = "bold " + Math.floor(boardH*.08) + "px Comic Sans MS, Arial";
  ctx.fillText(name, boardW*.50, boardH*.68);
}

async function makeSource(){
  const puzzle = currentLevel.puzzles[puzzleIndex];
  const c = document.createElement("canvas");
  c.width = boardW * SCALE;
  c.height = boardH * SCALE;
  const x = c.getContext("2d");
  x.scale(SCALE,SCALE);

  const bg = x.createLinearGradient(0,0,boardW,boardH);
  bg.addColorStop(0,"#fff7d6");
  bg.addColorStop(1,"#dff4ff");
  x.fillStyle = bg;
  x.fillRect(0,0,boardW,boardH);

  try{
    const img = await loadImage(puzzle.image);
    const iw = img.naturalWidth || img.width;
    const ih = img.naturalHeight || img.height;

    // Math.min keeps the full picture visible. Padding controls how large it appears.
    const scale = Math.min(boardW / iw, boardH / ih) * currentLevel.padding;
    const dw = iw * scale;
    const dh = ih * scale;
    const dx = (boardW - dw) / 2;
    const dy = (boardH - dh) / 2;
    x.drawImage(img,dx,dy,dw,dh);
  }catch(error){
    console.error(error);
    drawPlaceholder(x,puzzle.name);
  }
  return c;
}

/* ============================================================
   JIGSAW SHAPE LOGIC
   ============================================================ */

function buildEdgeSigns(){
  V = [];
  H = [];
  for(let r=0;r<rows;r++){
    V[r] = [];
    for(let c=0;c<=cols;c++) V[r][c] = c===0 || c===cols ? 0 : (Math.random()<.5 ? 1 : -1);
  }
  for(let r=0;r<=rows;r++){
    H[r] = [];
    for(let c=0;c<cols;c++) H[r][c] = r===0 || r===rows ? 0 : (Math.random()<.5 ? 1 : -1);
  }
}
function edgeOut(side,c,r){
  if(side==="top") return r===0 ? null : (H[r][c]===-1);
  if(side==="bottom") return r===rows-1 ? null : (H[r+1][c]===1);
  if(side==="left") return c===0 ? null : (V[r][c]===-1);
  if(side==="right") return c===cols-1 ? null : (V[r][c+1]===1);
}
function tracePiece(x,c,r){
  const m = margin;
  const s = cell;
  const TL = [m,m];
  const TR = [m+s,m];
  const BR = [m+s,m+s];
  const BL = [m,m+s];
  const cx = m+s/2;
  const cy = m+s/2;
  x.beginPath();
  x.moveTo(...TL);
  drawEdge(x,"top",edgeOut("top",c,r),cx,m,TR);
  drawEdge(x,"right",edgeOut("right",c,r),m+s,cy,BR);
  drawEdge(x,"bottom",edgeOut("bottom",c,r),cx,m+s,BL);
  drawEdge(x,"left",edgeOut("left",c,r),m,cy,TL);
  x.closePath();
}
function drawEdge(x,side,out,mx,my,end){
  if(out===null){ x.lineTo(...end); return; }
  const acw = !out;
  if(side==="top"){
    x.lineTo(mx-kr,my);
    x.arc(mx,my,kr,Math.PI,0,acw);
  }
  if(side==="right"){
    x.lineTo(mx,my-kr);
    x.arc(mx,my,kr,-Math.PI/2,Math.PI/2,acw);
  }
  if(side==="bottom"){
    x.lineTo(mx+kr,my);
    x.arc(mx,my,kr,0,Math.PI,acw);
  }
  if(side==="left"){
    x.lineTo(mx,my+kr);
    x.arc(mx,my,kr,Math.PI/2,-Math.PI/2,acw);
  }
  x.lineTo(...end);
}

/* ============================================================
   LAYOUT
   ============================================================ */

function computeLayout(){
  cols = currentLevel.cols;
  rows = currentLevel.rows;
  const sw = stage.clientWidth;
  const sh = stage.clientHeight;
  const maxBoardW = sw * .94;
  const maxBoardH = sh * .50;
  cell = Math.floor(Math.min(maxBoardW / cols, maxBoardH / rows));
  cell = Math.max(cell,56);
  kr = cell * .16;
  margin = Math.ceil(kr) + 4;
  boardW = cols * cell;
  boardH = rows * cell;
  boardLeft = Math.round((sw - boardW) / 2);
  boardTop = Math.round(sh * .04);
}

/* ============================================================
   BUILD PUZZLE
   ============================================================ */

async function buildLevel(){
  pieces.forEach(p=>p.el.remove());
  pieces = [];
  lockedCount = 0;
  document.querySelectorAll(".confetti").forEach(c=>c.remove());
  winBox.classList.remove("show");

  computeLayout();
  buildEdgeSigns();
  const src = await makeSource();

  guideC.width = boardW * SCALE;
  guideC.height = boardH * SCALE;
  guideC.style.width = boardW + "px";
  guideC.style.height = boardH + "px";
  guideC.style.left = boardLeft + "px";
  guideC.style.top = boardTop + "px";
  const guideCtx = guideC.getContext("2d");
  guideCtx.clearRect(0,0,guideC.width,guideC.height);
  guideCtx.drawImage(src,0,0);

  slotsC.width = (boardW + margin * 2) * SCALE;
  slotsC.height = (boardH + margin * 2) * SCALE;
  slotsC.style.width = (boardW + margin * 2) + "px";
  slotsC.style.height = (boardH + margin * 2) + "px";
  slotsC.style.left = (boardLeft - margin) + "px";
  slotsC.style.top = (boardTop - margin) + "px";

  const sx = slotsC.getContext("2d");
  sx.clearRect(0,0,slotsC.width,slotsC.height);
  sx.setTransform(SCALE,0,0,SCALE,0,0);
  sx.strokeStyle = "rgba(90,70,140,.35)";
  sx.lineWidth = 2;
  sx.setLineDash([6,5]);

  const order = [];
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) order.push({c,r});

  for(const {c,r} of order){
    sx.save();
    sx.translate(c*cell,r*cell);
    tracePiece(sx,c,r);
    sx.restore();
    sx.stroke();

    const pc = document.createElement("canvas");
    const full = cell + margin * 2;
    pc.width = full * SCALE;
    pc.height = full * SCALE;
    pc.style.width = full + "px";
    pc.style.height = full + "px";
    const px = pc.getContext("2d");
    px.scale(SCALE,SCALE);
    tracePiece(px,c,r);
    px.clip();
    px.drawImage(src,(c*cell-margin)*SCALE,(r*cell-margin)*SCALE,full*SCALE,full*SCALE,0,0,full,full);
    px.lineWidth = 3;
    px.strokeStyle = "rgba(255,255,255,.92)";
    tracePiece(px,c,r);
    px.stroke();

    pc.className = "piece";
    const slotX = boardLeft + c * cell - margin;
    const slotY = boardTop + r * cell - margin;
    const p = { el:pc, col:c, row:r, locked:false, slotX, slotY, w:full };
    placeAt(p,slotX,slotY);
    pieces.push(p);
    stage.appendChild(pc);
    attachDrag(p);
  }

  scatterPieces();
  updateHUD();
  lvlNum.textContent = currentLevel.number;
  title.textContent = currentLevel.title + ": " + currentLevel.puzzles[puzzleIndex].name;
  say("Let's build " + currentLevel.puzzles[puzzleIndex].name + "!");
  lastW = stage.clientWidth;
  lastH = stage.clientHeight;
}

function scatterPieces(){
  const sw = stage.clientWidth;
  const sh = stage.clientHeight;
  const trayTop = boardTop + boardH + 12;
  const shuffled = [...pieces].sort(()=>Math.random()-.5);
  shuffled.forEach((p,i)=>{
    const maxX = Math.max(4,sw - p.w - 4);
    const maxY = Math.max(trayTop,sh - p.w - 4);
    const x = 4 + Math.random() * Math.max(1,(maxX - 4));
    const y = trayTop + Math.random() * Math.max(1,(maxY - trayTop));
    placeAt(p,x,y);
    p.el.style.zIndex = 10 + i;
  });
}
function placeAt(p,x,y){
  p.el.style.translate = `${x}px ${y}px`;
  p.x = x;
  p.y = y;
}
function updateHUD(){ pieceCt.textContent = lockedCount + "/" + pieces.length; }

/* ============================================================
   DRAG AND DROP
   ============================================================ */

let zTop = 1000;
function attachDrag(p){
  let dragging = false;
  let offX = 0;
  let offY = 0;
  let pid = null;

  p.el.addEventListener("pointerdown",e=>{
    if(p.locked) return;
    initAudio();
    dragging = true;
    pid = e.pointerId;
    p.el.setPointerCapture(pid);
    const rect = stage.getBoundingClientRect();
    offX = (e.clientX - rect.left) - p.x;
    offY = (e.clientY - rect.top) - p.y;
    p.el.classList.add("lifting");
    p.el.style.zIndex = ++zTop;
    Snd.pick();
    e.preventDefault();
  });

  p.el.addEventListener("pointermove",e=>{
    if(!dragging) return;
    const rect = stage.getBoundingClientRect();
    let x = (e.clientX - rect.left) - offX;
    let y = (e.clientY - rect.top) - offY;
    x = Math.max(-margin,Math.min(x,stage.clientWidth - p.w + margin));
    y = Math.max(-margin,Math.min(y,stage.clientHeight - p.w + margin));
    placeAt(p,x,y);
    e.preventDefault();
  });

  function end(e){
    if(!dragging) return;
    dragging = false;
    try{ p.el.releasePointerCapture(pid); }catch(_){}
    p.el.classList.remove("lifting");
    const dx = p.x - p.slotX;
    const dy = p.y - p.slotY;
    if(Math.hypot(dx,dy) < cell * .55) lockPiece(p);
    if(e) e.preventDefault();
  }
  p.el.addEventListener("pointerup",end);
  p.el.addEventListener("pointercancel",end);
}
function lockPiece(p){
  p.locked = true;
  p.el.classList.add("locked","settling");
  placeAt(p,p.slotX,p.slotY);
  p.el.classList.remove("snapped");
  void p.el.offsetWidth;
  p.el.classList.add("snapped");
  setTimeout(()=>p.el.classList.remove("settling"),220);
  p.el.style.zIndex = 5;
  lockedCount++;
  updateHUD();
  Snd.snap();
  if(lockedCount === pieces.length) win();
}

/* ============================================================
   WIN
   ============================================================ */

function win(){
  Snd.win();
  Snd.cheer();
  const praise = PRAISE[puzzleIndex % PRAISE.length];
  winText.textContent = praise;
  winSubText.textContent = currentLevel.theme + " puzzle " + (puzzleIndex + 1) + " of " + currentLevel.puzzles.length + " complete!";
  say(praise);
  confettiBurst();
  setTimeout(()=>winBox.classList.add("show"),450);
}
async function nextPuzzle(){
  puzzleIndex = (puzzleIndex + 1) % currentLevel.puzzles.length;
  await buildLevel();
}
function confettiBurst(){
  const colors = ["#ffe066","#ffb3d1","#a8e6a1","#8eccff","#ffb35c","#c9b3ff"];
  const sw = stage.clientWidth;
  for(let i=0;i<60;i++){
    const d = document.createElement("div");
    d.className = "confetti";
    d.style.background = colors[i % colors.length];
    const startX = sw / 2 + (Math.random() - .5) * 80;
    d.style.left = startX + "px";
    d.style.top = "-20px";
    stage.appendChild(d);
    const dx = (Math.random() - .5) * sw * .9;
    const dy = stage.clientHeight * .9 + Math.random() * 120;
    d.animate([
      {transform:`translate(0,0) rotate(0deg)`,opacity:1},
      {transform:`translate(${dx}px,${dy}px) rotate(${Math.random()*720}deg)`,opacity:.9}
    ],{duration:1500 + Math.random() * 900,easing:"cubic-bezier(.2,.6,.3,1)"});
    setTimeout(()=>d.remove(),2400);
  }
}

/* ============================================================
   CONTROLS
   ============================================================ */

document.getElementById("restartBtn").addEventListener("click",async()=>{ Snd.pick(); await buildLevel(); });
document.getElementById("skipBtn").addEventListener("click",async()=>{ Snd.pick(); await nextPuzzle(); });
document.getElementById("nextBtn").addEventListener("click",async()=>{ Snd.pick(); await nextPuzzle(); });
document.getElementById("homeBtn").addEventListener("click",goHome);

function goHome(){
  Snd.pick();
  if("speechSynthesis" in window) speechSynthesis.cancel();
  winBox.classList.remove("show");
  document.getElementById("tools").classList.remove("show");
  document.getElementById("gate").style.display = "flex";
}

const muteBtn = document.getElementById("muteBtn");
muteBtn.addEventListener("click",()=>{
  muted = !muted;
  muteBtn.textContent = muted ? "🔇" : "🔊";
  muteBtn.dataset.icon = muted ? "🔇" : "🔊";
  muteBtn.classList.toggle("muted",muted);
  if(muted && "speechSynthesis" in window) speechSynthesis.cancel();
  if(!muted){ initAudio(); Snd.pick(); }
});

document.querySelectorAll(".level-btn").forEach(btn=>{
  btn.addEventListener("click",async()=>{
    const level = Number(btn.dataset.level);
    if(LEVELS[level]){
      await startLevel(level);
    }else{
      showToast("Level " + level + " coming soon!");
      Snd.pick();
    }
  });
});

function showToast(message){
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(()=>toast.classList.remove("show"),1600);
}

async function startLevel(levelNumber){
  initAudio();
  currentLevelNumber = levelNumber;
  currentLevel = LEVELS[levelNumber];
  puzzleIndex = 0;
  document.getElementById("gate").style.display = "none";
  document.getElementById("tools").classList.add("show");
  showToast("Loading " + currentLevel.title + "...");
  try{
    await buildLevel();
    showToast("Drag the pieces!");
  }catch(error){
    console.error("Puzzle failed to load:",error);
    document.getElementById("gate").style.display = "flex";
    document.getElementById("tools").classList.remove("show");
    showToast("Image name problem!");
    alert("Puzzle image failed to load. Please check the filenames in puzzle/level1-assets, puzzle/assets, or puzzle/level3-assets.");
  }
}

/* ============================================================
   RESIZE / ORIENTATION
   ============================================================ */

let rt = null;
window.addEventListener("resize",()=>{
  clearTimeout(rt);
  rt = setTimeout(async()=>{
    const w = stage.clientWidth;
    const h = stage.clientHeight;
    if(w !== lastW || Math.abs(h-lastH) > lastH * .25){
      if(document.getElementById("gate").style.display === "none") await buildLevel();
    }
  },180);
});
</script>
